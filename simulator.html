<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CYD Dashboard Simulator</title>
<style>
:root {
  --bg: #08090d;
  --surface: #0f1117;
  --surface-alt: #161b27;
  --border: rgba(255,255,255,0.08);
  --text: #f1f5f9;
  --text2: #94a3b8;
  --muted: #64748b;
  --accent: #F4620E;
  --good: #22c55e;
  --warn: #f43f5e;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.2);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  min-height: 100vh;
  padding: 24px;
}
header { margin-bottom: 20px; }
header h1 { font-size: 20px; font-weight: 600; }
header p { color: var(--text2); font-size: 13px; margin-top: 4px; }

.layout {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 24px;
  align-items: start;
}
@media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }

/* ── simulated device ── */
.device {
  background: #3a3208;
  background: linear-gradient(145deg, #4a4110, #2e2806);
  border-radius: 16px;
  padding: 26px 22px;
  box-shadow: var(--shadow);
  display: inline-block;
}
.device-label {
  text-align: center;
  color: rgba(255,255,255,0.35);
  font-size: 10px;
  letter-spacing: 2px;
  margin-top: 12px;
  text-transform: uppercase;
}
#screen {
  display: block;
  background: #000;
  border: 3px solid #111;
  border-radius: 4px;
  cursor: pointer;
  image-rendering: pixelated;
}

/* ── control panel ── */
.panel {
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-width: 640px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.card h2 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text2);
  margin-bottom: 12px;
}
.control-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-bottom: 10px;
}
.control-row:last-child { margin-bottom: 0; }
label { font-size: 13px; color: var(--text2); }
input[type="text"], select {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 7px 10px;
  font-size: 13px;
  font-family: inherit;
}
input[type="text"] { flex: 1; min-width: 220px; }
input[type="text"]:focus, select:focus, button:focus {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
button {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--text);
  padding: 7px 16px;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.15s ease;
}
button:hover { background: rgba(255,255,255,0.1); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { opacity: 0.88; }
.toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text2);
  cursor: pointer;
}
.status-line {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.status-line .dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-right: 5px;
}
.dot.ok { background: var(--good); animation: pulse 2s infinite; }
.dot.bad { background: var(--warn); }
@keyframes pulse { 50% { opacity: 0.4; } }

pre {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
  font-size: 11.5px;
  line-height: 1.5;
  overflow-x: auto;
  max-height: 260px;
  overflow-y: auto;
  color: var(--text2);
}
#log { max-height: 150px; }
#log .err { color: var(--warn); }
#log .ok { color: var(--good); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<header>
  <h1>CYD Dashboard Simulator</h1>
  <p>Simulates the 2.8&Prime; 320&times;240 landscape ESP32-2432S028R screen. Click/tap the screen to cycle pages, exactly like the firmware.</p>
</header>

<main class="layout">
  <section class="device" aria-label="Simulated CYD device">
    <canvas id="screen" width="320" height="240" aria-label="Simulated 320 by 240 landscape display, click to change page"></canvas>
    <div class="device-label">ESP32-2432S028R &middot; simulated</div>
  </section>

  <section class="panel">
    <div class="card">
      <h2>Connection</h2>
      <div class="control-row">
        <input type="text" id="server-url" value="http://localhost:8787/api/usage" aria-label="Server URL">
        <button class="primary" id="poll-now">Poll now</button>
      </div>
      <div class="control-row">
        <label for="poll-interval">Poll every</label>
        <select id="poll-interval" aria-label="Poll interval">
          <option value="5000">5s</option>
          <option value="10000">10s</option>
          <option value="20000" selected>20s (firmware default)</option>
          <option value="60000">60s</option>
          <option value="300000">5m</option>
        </select>
        <label class="toggle"><input type="checkbox" id="sim-offline"> Simulate server offline</label>
        <label class="toggle"><input type="checkbox" id="mock-data"> Use mock data</label>
        <label class="toggle"><input type="checkbox" id="sim-sd-missing"> Simulate SD card missing</label>
        <label class="toggle"><input type="checkbox" id="force-hourly-flash"> Force hourly flash (test)</label>
      </div>
      <div class="status-line">
        <span id="conn-status"><span class="dot bad"></span>not connected</span>
        <span id="fetch-status">no fetch yet</span>
        <span id="page-status">page 1/7</span>
      </div>
    </div>

    <div class="card">
      <h2>Last response</h2>
      <pre id="raw-json">&mdash;</pre>
    </div>

    <div class="card">
      <h2>Log</h2>
      <pre id="log"></pre>
    </div>
  </section>
</main>

<script>
// ── CONSTANTS (mirroring cyd_dashboard.ino) ───────────────
const POLL_DEFAULT_MS = 20000;
const PAGE_COUNT = 5;
const FOOTER_RIGHT_PADDING = 8;  // twin of pages.cpp's FOOTER_RIGHT_PADDING
const GIF_PAGE = 3;   // 4th page: random cat GIFs on the device (stand-in here — see drawGifPage)
const MIXED_PAGE = 4; // 5th page: status + cats split

// Anti-retention pixel shift — mirrors the firmware's SHIFT_ORBIT/cfgShiftStepMs:
// the whole frame is blitted at an offset that orbits 0-2px (right/up only, so
// nothing is clipped away), one step every 3 minutes.
const SHIFT_ORBIT = [[0,0],[1,0],[2,0],[2,-1],[2,-2],[1,-2],[0,-2],[0,-1]];
// mirrors the firmware's cfgShiftStepMs -- not const since the Settings
// page's Pixel Shift leaf (applyPixelShift) can now change it at runtime.
let SHIFT_STEP_MS = 180000;  // firmware default; flash "pixel_shift_min" * 60000
// Consecutive failed polls before haveData is forced back to false, mirroring
// the firmware's fetchFailCycles/OFFLINE_AFTER_CYCLES.
const OFFLINE_AFTER_CYCLES = 3;
const LAST_USAGE_KEY = 'cyddashboard_v1_lastusage';

// Weather card hit-box on the status page (page 0): matches the full card
// drawn at fillRect(161,166,157,52). Tap opens the Weather overlay —
// mirrors the firmware's WEATHER_HIT_*.
const WEATHER_HIT_X0 = 161, WEATHER_HIT_X1 = 318;
const WEATHER_HIT_Y0 = 166, WEATHER_HIT_Y1 = 218;

// Footer CPU/ROM/RAM stats hit-box -- tap opens the Device Stats overlay.
// Mirrors the firmware's DEVICE_HIT_*.
const DEVICE_HIT_X0 = 40, DEVICE_HIT_X1 = 210;
const DEVICE_HIT_Y0 = 214, DEVICE_HIT_Y1 = 240;

// Footer settings gear icon, bottom-right corner -- tap opens the Settings
// list. Mirrors the firmware's SETTINGS_HIT_*; replaces the old invisible
// hit-box that used to sit over the connection-status pulse dot.
const SETTINGS_HIT_X0 = 282, SETTINGS_HIT_X1 = 316;
const SETTINGS_HIT_Y0 = 219, SETTINGS_HIT_Y1 = 240;
const WEATHER_HOURLY_N = 6;
const WEATHER_DAILY_N = 5;
const LAST_WEATHER_KEY = 'cyddashboard_v1_weather';

// Settings (generic LIST + leaf GRID) geometry -- mirrors the firmware's
// SET_BACK_*/SET_BTN_*/SET_ROW_* exactly.
const SET_BACK_X0 = 0, SET_BACK_X1 = 100, SET_BACK_Y0 = 0, SET_BACK_Y1 = 34;
const SET_BTN_X0 = 11, SET_BTN_Y = 100, SET_BTN_W = 54, SET_BTN_H = 56;
const SET_BTN_STEP = 58, SET_BTN_STEP_Y = 62;  // STEP_Y only matters for rows>1
const SET_ROW_X0 = 10, SET_ROW_Y0 = 34, SET_ROW_W = 302, SET_ROW_H = 46, SET_ROW_STEP = 52;
// A lone action button (count==1, e.g. Restart/Forget WiFi) gets the full
// row width instead of one narrow preset-grid cell -- mirrors the firmware's
// SET_WIDE_BTN_X0/W.
const SET_WIDE_BTN_X0 = SET_ROW_X0, SET_WIDE_BTN_W = SET_ROW_W;
// The list scrolls rather than paginates -- mirrors the firmware's
// SETTINGS_VISIBLE_ROWS/SETTINGS_VIEWPORT_*/SETTINGS_CONTENT_H/
// SETTINGS_SCROLL_MAX exactly (see settings.cpp).
const SETTINGS_VISIBLE_ROWS = 4;
const SETTINGS_VIEWPORT_Y0 = SET_ROW_Y0;
const SETTINGS_VIEWPORT_H = SETTINGS_VISIBLE_ROWS * SET_ROW_STEP - (SET_ROW_STEP - SET_ROW_H);
const SETTINGS_SCROLLBAR_X = 316, SETTINGS_SCROLLBAR_W = 4;
const BRIGHTNESS_KEY = 'cyddashboard_v1_brightness';
const BOOT_PAGE_KEY = 'cyddashboard_v1_bootpage';
const CAT_SHUFFLE_KEY = 'cyddashboard_v1_catshuffle';
const NIGHT_MODE_KEY = 'cyddashboard_v1_nightmode';
const ROTATION_KEY = 'cyddashboard_v1_rotation';
const SHOW_COUNTDOWN_KEY = 'cyddashboard_v1_showcountdown';
const BATTERY_SAVE_KEY = 'cyddashboard_v1_batterysave';
const SHOW_AQI_KEY = 'cyddashboard_v1_showaqi';
// Mirrors firmware BATTERY_SAVE_POLL_SEC (usage-poll floor only; no dim).
const BATTERY_SAVE_POLL_SEC = 120;

// SettingDef table -- mirrors the firmware's SettingDef struct/SETTINGS[]
// array field-for-field (label/leafTitle/subtitle/hint/cols/rows/count/
// values/valueLabels/btnTextSize/destructive/getCurrent/apply), just as a
// plain JS array of objects instead of a C struct array.
function getCurrentBrightness() { return STATE.cfgBrightness; }
function applyBrightness(v) {
  STATE.cfgBrightness = v;
  localStorage.setItem(BRIGHTNESS_KEY, String(v));
  applyEffectiveBrightnessFilter();
}
// Destructive/action rows have no "current value" -- drawSettingsLeaf()
// skips getCurrent() for them via .destructive, but the field still needs a
// function. A page reload is the simulator's stand-in for ESP.restart(): no
// real device to reboot, but it's the closest browser equivalent (STATE
// re-initializes fresh, same as the board re-running setup()).
function getCurrentNone() { return -1; }
function applyRestart(v) { location.reload(); }

// Forget WiFi: no real WiFi/AP-portal to simulate in a browser, so this is a
// console-log stand-in (same "no-op for firmware-only effects" pattern as
// Restart's reload) -- it doesn't erase brightness/boot-page, matching the
// firmware which only touches wifi_ssid/wifi_password.
function applyForgetWifi(v) {
  console.log('[sim] Forget WiFi: on real hardware this erases wifi_ssid/' +
              'wifi_password from flash and restarts into the AP setup portal.');
  location.reload();
}

// Cat shuffle interval: cosmetic/persisted only -- the simulator's cat page
// is a static placeholder (see drawGifPage), not real GIF playback, so
// there's no pacing to actually hook this into (same firmware-only-effect
// exception already documented for cat GIFs generally).
function getCurrentCatShuffle() { return STATE.catShuffleSec; }
function applyCatShuffle(v) {
  STATE.catShuffleSec = v;
  localStorage.setItem(CAT_SHUFFLE_KEY, String(v));
}

// Night mode: fixed 23:00-07:00 schedule, dims to a fixed 25% while active --
// mirrors the firmware's cfgNightModeOn/nightDimActive/NIGHT_MODE_DIM_VALUE.
// bangkokParts() is this simulator's getLocalTime() stand-in (no DST, fixed
// UTC+7, matching GMT_OFFSET_SEC), checked once/sec from tick() below.
// Battery Save does not touch brightness (firmware parity).
let nightDimActive = false;
let lastNightCheckMs = 0;
function applyEffectiveBrightnessFilter() {
  if (nightDimActive) {
    canvas.style.filter = 'brightness(25%)';
    return;
  }
  applyBrightnessFilter();
}
function getCurrentNightMode() { return STATE.cfgNightModeOn ? 1 : 0; }
function applyNightMode(v) {
  STATE.cfgNightModeOn = v !== 0;
  localStorage.setItem(NIGHT_MODE_KEY, String(v));
  if (!STATE.cfgNightModeOn && nightDimActive) {
    nightDimActive = false;
    applyEffectiveBrightnessFilter();  // restore user brightness
  }
}
function checkNightMode() {
  const now = performance.now();
  if (now - lastNightCheckMs < 1000) return;
  lastNightCheckMs = now;
  if (!STATE.cfgNightModeOn) return;
  const bkk = bangkokParts();
  if (!bkk) return;
  const hour = parseInt(bkk.hour, 10);
  const inWindow = hour >= 23 || hour < 7;
  if (inWindow && !nightDimActive) {
    nightDimActive = true;
    applyEffectiveBrightnessFilter();
  } else if (!inWindow && nightDimActive) {
    nightDimActive = false;
    applyEffectiveBrightnessFilter();
  }
}

// Battery Save: 2 min usage-poll floor. Modes OFF/ON/AUTO mirror the
// firmware (AUTO follows Mac power.battery_save from /api/usage).
const BATTERY_SAVE_OFF = 0, BATTERY_SAVE_ON = 1, BATTERY_SAVE_AUTO = 2;
function batterySaveActive() {
  if (STATE.cfgBatterySaveMode === BATTERY_SAVE_ON) return true;
  if (STATE.cfgBatterySaveMode === BATTERY_SAVE_AUTO) return !!STATE.serverBatterySave;
  return false;
}
function getCurrentBatterySave() { return STATE.cfgBatterySaveMode; }
function applyBatterySave(v) {
  STATE.cfgBatterySaveMode = Math.max(BATTERY_SAVE_OFF, Math.min(BATTERY_SAVE_AUTO, v));
  localStorage.setItem(BATTERY_SAVE_KEY, String(STATE.cfgBatterySaveMode));
  restartPollTimer();
}
function effectivePollMs() {
  let sec = Number(document.getElementById('poll-interval').value) / 1000;
  if (!Number.isFinite(sec) || sec <= 0) sec = POLL_DEFAULT_MS / 1000;
  if (batterySaveActive() && sec < BATTERY_SAVE_POLL_SEC) sec = BATTERY_SAVE_POLL_SEC;
  return sec * 1000;
}

// Rotation flip: applies live on real hardware (see the firmware's
// applyRotation() comment for why touch needs no recalibration). A real
// 180deg canvas transform would need offsetX/offsetY math the click handler
// doesn't do, so this is a console-log stand-in + persisted value only,
// same "no-op for firmware-only effects" pattern as Restart/Forget WiFi.
function getCurrentRotation() { return STATE.cfgScreenRotation; }
function applyRotation(v) {
  STATE.cfgScreenRotation = v;
  localStorage.setItem(ROTATION_KEY, String(v));
  console.log('[sim] Rotation: on real hardware this calls gfx.applyRuntimeConfig() ' +
              'immediately, no restart -- see cyd_dashboard.ino for why touch needs no recalibration.');
}

// Show Countdown: green bars under 5h/week + analog clock timer wedge.
// Green reset hand always stays. Default ON (mirrors cfgShowCountdown).
function getCurrentShowCountdown() { return STATE.cfgShowCountdown ? 1 : 0; }
function applyShowCountdown(v) {
  STATE.cfgShowCountdown = v !== 0;
  localStorage.setItem(SHOW_COUNTDOWN_KEY, String(v));
}

// AQI badge next to the status-page date. Default ON (mirrors cfgShowAqi).
function getCurrentShowAqi() { return STATE.cfgShowAqi ? 1 : 0; }
function applyShowAqi(v) {
  STATE.cfgShowAqi = v !== 0;
  localStorage.setItem(SHOW_AQI_KEY, String(v));
}

// Poll interval: wired to the sidebar's real "#poll-interval" select + its
// restartPollTimer(), so picking a preset here actually changes the
// simulated fetch cadence -- a genuine effect, not just a cosmetic stand-in.
function getCurrentPollInterval() {
  return Number(document.getElementById('poll-interval').value) / 1000;
}
function applyPollInterval(v) {
  document.getElementById('poll-interval').value = String(v * 1000);
  restartPollTimer();
}

// Pixel shift: SHIFT_STEP_MS is only read by render()'s shift-orbit advance
// (the browser has one thread, so no cross-core concern to mirror here).
function getCurrentPixelShift() { return SHIFT_STEP_MS / 60000; }
function applyPixelShift(v) { SHIFT_STEP_MS = v * 60000; }

// Boot page: all 7 pages (including cats/mixed) are valid -- drawScreenContent()
// already dispatches generically off STATE.currentPage regardless of how it
// was set, no special-casing needed here either. Device Stats isn't in this
// list -- it's an overlay (devicePageOpen), not a currentPage value.
function getCurrentBootPage() { return STATE.cfgBootPage; }
function applyBootPage(v) {
  STATE.cfgBootPage = v;
  STATE.currentPage = v;  // jump the live dashboard too, mirrors the firmware
  localStorage.setItem(BOOT_PAGE_KEY, String(v));
}

const SETTINGS = [
  { label: 'BRIGHTNESS', leafTitle: 'BRIGHTNESS', subtitle: 'BACKLIGHT BRIGHTNESS',
    hint: 'TAP A LEVEL TO APPLY', cols: 5, rows: 1, count: 5,
    values: [0, 64, 128, 191, 255], valueLabels: ['0%', '25%', '50%', '75%', '100%'],
    btnTextSize: 2, destructive: false,
    getCurrent: getCurrentBrightness, apply: applyBrightness },
  { label: 'POLL INTERVAL', leafTitle: 'POLL INTERVAL', subtitle: 'HOW OFTEN TO FETCH /API/USAGE',
    hint: 'TAP A RATE TO APPLY', cols: 5, rows: 1, count: 5,
    values: [5, 10, 20, 60, 300], valueLabels: ['5s', '10s', '20s', '60s', '5m'],
    btnTextSize: 2, destructive: false,
    getCurrent: getCurrentPollInterval, apply: applyPollInterval },
  { label: 'PIXEL SHIFT', leafTitle: 'PIXEL SHIFT', subtitle: 'ANTI-RETENTION ORBIT INTERVAL',
    hint: 'TAP A RATE TO APPLY', cols: 4, rows: 1, count: 4,
    values: [0, 1, 3, 10], valueLabels: ['OFF', '1m', '3m', '10m'],
    btnTextSize: 2, destructive: false,
    getCurrent: getCurrentPixelShift, apply: applyPixelShift },
  { label: 'BOOT PAGE', leafTitle: 'BOOT PAGE', subtitle: 'PAGE SHOWN AFTER POWER-ON',
    hint: 'TAP A PAGE TO APPLY', cols: 3, rows: 2, count: 5,
    values: [0, 1, 2, 3, 4],
    valueLabels: ['STATUS', 'PROJECTS', 'LIMITS', 'CATS', 'MIXED'],
    btnTextSize: 1, destructive: false,
    getCurrent: getCurrentBootPage, apply: applyBootPage },
  { label: 'RESTART', leafTitle: 'RESTART', subtitle: '',
    hint: 'TAP TWICE TO RESTART THE BOARD', cols: 1, rows: 1, count: 1,
    values: [0], valueLabels: ['RESTART'],
    btnTextSize: 2, destructive: true,
    getCurrent: getCurrentNone, apply: applyRestart },
  { label: 'FORGET WIFI', leafTitle: 'FORGET WIFI', subtitle: '',
    hint: 'TAP TWICE TO ERASE WIFI CREDS', cols: 1, rows: 1, count: 1,
    values: [0], valueLabels: ['FORGET WIFI'],
    btnTextSize: 2, destructive: true,
    getCurrent: getCurrentNone, apply: applyForgetWifi },
  { label: 'CAT SHUFFLE', leafTitle: 'CAT SHUFFLE', subtitle: 'HOW LONG EACH CAT GIF PLAYS',
    hint: 'TAP A RATE TO APPLY', cols: 4, rows: 1, count: 4,
    values: [0, 5, 10, 30], valueLabels: ['OFF', '5s', '10s', '30s'],
    btnTextSize: 2, destructive: false,
    getCurrent: getCurrentCatShuffle, apply: applyCatShuffle },
  { label: 'NIGHT MODE', leafTitle: 'NIGHT MODE', subtitle: '23:00-07:00, DIMS TO 25%',
    hint: 'TAP TO TOGGLE', cols: 2, rows: 1, count: 2,
    values: [0, 1], valueLabels: ['OFF', 'ON'],
    btnTextSize: 2, destructive: false,
    getCurrent: getCurrentNightMode, apply: applyNightMode },
  { label: 'BATTERY SAVE', leafTitle: 'BATTERY SAVE', subtitle: '2MIN POLL; AUTO = FOLLOW MAC',
    hint: 'TAP A MODE TO APPLY', cols: 3, rows: 1, count: 3,
    values: [0, 1, 2], valueLabels: ['OFF', 'ON', 'AUTO'],
    btnTextSize: 2, destructive: false,
    getCurrent: getCurrentBatterySave, apply: applyBatterySave },
  { label: 'ROTATION', leafTitle: 'ROTATION', subtitle: 'FOR UPSIDE-DOWN MOUNTING',
    hint: 'APPLIES IMMEDIATELY', cols: 2, rows: 1, count: 2,
    values: [1, 3], valueLabels: ['NORMAL', 'FLIPPED'],
    btnTextSize: 1, destructive: false,
    getCurrent: getCurrentRotation, apply: applyRotation },
  { label: 'SHOW COUNTDOWN', leafTitle: 'SHOW COUNTDOWN', subtitle: 'GREEN BARS + CLOCK WEDGE',
    hint: 'TAP TO TOGGLE', cols: 2, rows: 1, count: 2,
    values: [0, 1], valueLabels: ['OFF', 'ON'],
    btnTextSize: 2, destructive: false,
    getCurrent: getCurrentShowCountdown, apply: applyShowCountdown },
  { label: 'SHOW AQI', leafTitle: 'SHOW AQI', subtitle: 'BADGE NEXT TO THE STATUS DATE',
    hint: 'TAP TO TOGGLE', cols: 2, rows: 1, count: 2,
    values: [0, 1], valueLabels: ['OFF', 'ON'],
    btnTextSize: 2, destructive: false,
    getCurrent: getCurrentShowAqi, apply: applyShowAqi },
];
const SETTINGS_COUNT = 12;
const SETTINGS_CONTENT_H = SETTINGS_COUNT * SET_ROW_STEP - (SET_ROW_STEP - SET_ROW_H);
const SETTINGS_SCROLL_MAX = (SETTINGS_CONTENT_H > SETTINGS_VIEWPORT_H)
    ? (SETTINGS_CONTENT_H - SETTINGS_VIEWPORT_H) : 0;
const CONFIRM_ARM_MS = 4000;

// Flash/RAM are on-device figures with no browser equivalent, so these
// mirror the last arduino-cli compile report rather than a live query
// (they only change when the sketch is recompiled, same as on the board).
const FLASH_USED_BYTES = 1303463;
const FLASH_TOTAL_BYTES = 1310720;
const STATIC_RAM_BYTES = 57392;
const TOTAL_RAM_BYTES = 327680;

// SD card capacity has no browser equivalent either, so this mocks a
// plausible 8GB card partway full; "Simulate SD card missing" overrides it.
const SD_USED_BYTES = 2483027968;
const SD_TOTAL_BYTES = 7948206080;

// RGB565 firmware colors converted to RGB888 exactly as the panel shows them
const COL_BG      = 'rgb(8,8,8)';       // 0x0841
const COL_SURFACE = 'rgb(8,8,8)';       // 0x0841 (card fill = bg, no surface tint)
const COL_BORDER  = 'rgb(58,57,58)';    // 0x39C7
const COL_TEXT    = 'rgb(255,255,255)'; // 0xFFFF
const COL_TEXT2   = 'rgb(156,154,156)'; // 0x9CD3
const COL_ACCENT  = 'rgb(255,97,66)';   // 0xFB08
const COL_BLUE    = 'rgb(58,130,247)';  // 0x3C1E device-stats bar chart accent
const COL_YELLOW  = 'rgb(255,255,0)';   // 0xFFE0 yellow for sun/lightning icons

// ── SIMULATED GFX (LovyanGFX-ish API on canvas) ───────────
// Classic GFX font metrics: size 1 = 6x8 px per char (5x7 glyph + 1px gap).
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 3);
canvas.width = 320 * DPR;
canvas.height = 240 * DPR;
canvas.style.width = '320px';
canvas.style.height = '240px';
ctx.scale(DPR, DPR);

const gfx = {
  _color: COL_TEXT,
  _size: 1,
  _x: 0, _y: 0,
  fillScreen(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, 320, 240); },
  setTextColor(c) { this._color = c; },
  setTextSize(s) { this._size = s; },
  setCursor(x, y) { this._x = x; this._y = y; },
  print(str) {
    // The hardware GFX font is a 5x7 bitmap glyph in a 6x8 cell: it advances
    // 6px per char but the glyph fills 5px. Keep the 6px advance (so line
    // lengths match the device) while stretching each glyph to ~5px wide so
    // it fills the cell like the real font instead of leaving an airy gap.
    const s = this._size;
    const advance = 6 * s;
    const glyphW = 5 * s;
    ctx.fillStyle = this._color;
    ctx.font = `bold ${8 * s}px Menlo, Consolas, monospace`;
    ctx.textBaseline = 'top';
    str = String(str);
    for (let i = 0; i < str.length; i++) {
      const w = ctx.measureText(str[i]).width || glyphW;
      ctx.save();
      ctx.translate(this._x, this._y);
      ctx.scale(glyphW / w, 1);
      ctx.fillText(str[i], 0, 0);
      ctx.restore();
      this._x += advance;
    }
  },
  fillRect(x, y, w, h, c) {
    ctx.fillStyle = c;
    ctx.fillRect(x, y, w, h);
  },
  drawRect(x, y, w, h, c) {
    ctx.strokeStyle = c;
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  },
  drawFastVLine(x, y, h, c) {
    this.drawLine(x, y, x, y + h - 1, c);
  },
  textWidth(str) {
    return str.length * 6 * this._size;
  },
  fillRoundRect(x, y, w, h, r, c) {
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
  },
  drawRoundRect(x, y, w, h, r, c) {
    ctx.strokeStyle = c;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(x + 0.5, y + 0.5, w - 1, h - 1, r);
    ctx.stroke();
  },
  fillCircle(x, y, r, c) {
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  },
  drawCircle(x, y, r, c) {
    ctx.strokeStyle = c;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x + 0.5, y + 0.5, r, 0, Math.PI * 2);
    ctx.stroke();
  },
  fillTriangle(x0, y0, x1, y1, x2, y2, c) {
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.closePath();
    ctx.fill();
  },
  drawLine(x0, y0, x1, y1, c) {
    ctx.strokeStyle = c;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x0 + 0.5, y0 + 0.5);
    ctx.lineTo(x1 + 0.5, y1 + 0.5);
    ctx.stroke();
  },
  // Mirrors LovyanGFX/Adafruit drawFastHLine — used by the Weather page separators.
  drawFastHLine(x, y, w, c) {
    this.drawLine(x, y, x + w - 1, y, c);
  },
  // Mirrors LovyanGFX's drawWideLine(x0,y0,x1,y1,r,color) — r is the
  // wedge-line's half-width (radius), same unit as its firmware counterpart.
  drawWideLine(x0, y0, x1, y1, r, c) {
    ctx.strokeStyle = c;
    ctx.lineWidth = r * 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x0 + 0.5, y0 + 0.5);
    ctx.lineTo(x1 + 0.5, y1 + 0.5);
    ctx.stroke();
    ctx.lineCap = 'butt';
  },
  // Mirrors LovyanGFX's setClipRect/clearClipRect — used by the Settings
  // list's drag-scroll to keep partially-scrolled rows from drawing over the
  // header. save()/restore() bracket the canvas clip so it doesn't leak into
  // unrelated draw calls; clearClipRect() must be called before the next
  // fillScreen() or the clip region would stick around.
  setClipRect(x, y, w, h) {
    if (this._clipped) ctx.restore();
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();
    this._clipped = true;
  },
  clearClipRect() {
    if (this._clipped) { ctx.restore(); this._clipped = false; }
  },
};

// ── FORMATTING (mirroring the firmware) ───────────────────
function fmtTokens(t) {
  if (t >= 1e9) return (t / 1e9).toFixed(2) + 'B';
  if (t >= 1e6) return (t / 1e6).toFixed(1) + 'M';
  if (t >= 1e3) return (t / 1e3).toFixed(1) + 'K';
  return String(t);
}
function fmtCost(c) { return '$' + c.toFixed(2); }
function fmtBtc(p) {
  if (p < 0) return '--';
  return Math.round(p).toLocaleString('en-US');
}
function fmtCountdown(sec) {
  if (sec < 0) return '';
  let m = Math.floor((sec + 30) / 60);  // round to nearest minute
  const h = Math.floor(m / 60);
  m %= 60;
  return h > 0 ? h + 'h:' + String(m).padStart(2, '0') + 'm' : m + 'm';
}
// Day-aware countdown for windows that can span multiple days (the weekly
// reset). >=1 day: "1d:12h" (days + hours only). <1 day: "23h:59m", same
// shape as fmtCountdown.
function fmtCountdownDHM(sec) {
  if (sec < 0) return '';
  let totalMin = Math.floor((sec + 30) / 60);  // round to nearest minute
  const days = Math.floor(totalMin / 1440);
  if (days > 0) {
    const hours = Math.floor((totalMin % 1440) / 60);
    return days + 'd:' + hours + 'h';
  }
  const hours = Math.floor(totalMin / 60);
  const mins = totalMin % 60;
  return hours + 'h:' + String(mins).padStart(2, '0') + 'm';
}
function fmtKB(bytes) { return (bytes / 1024).toFixed(1) + 'KB'; }
function fmtGB(bytes) { return (bytes / (1024 ** 3)).toFixed(1) + 'GB'; }

// Small 3-bar signal icon next to the pulse dot: green when the most recent
// poll found WiFi up (STATE.wifiOk), rose when it didn't. Twin of
// pages.cpp's drawWifiIcon() — separate from the pulse dot so a WiFi outage
// and a server outage read as two distinct signals instead of one amber dot.
function drawWifiIcon() {
  const c = STATE.wifiOk ? COL_GOOD : COL_WARN;
  gfx.fillRect(22, 230, 2, 3, c);
  gfx.fillRect(25, 228, 2, 5, c);
  gfx.fillRect(28, 226, 2, 7, c);
}

// Footer settings gear, bottom-right corner (SETTINGS_HIT_* is its tap
// target). Twin of pages.cpp's drawSettingsIcon() -- a hub disc with a
// punched-out center + 8 short spokes, same vocabulary as the weather
// sun glyph, just smaller and gray so it reads as UI chrome.
function drawSettingsIcon() {
  const cx = 299, cy = 230;
  gfx.fillCircle(cx, cy, 3, COL_TEXT2);
  gfx.fillCircle(cx, cy, 1, COL_BG);
  gfx.drawWideLine(cx, cy - 6, cx, cy - 4, 1.0, COL_TEXT2);
  gfx.drawWideLine(cx, cy + 4, cx, cy + 6, 1.0, COL_TEXT2);
  gfx.drawWideLine(cx - 6, cy, cx - 4, cy, 1.0, COL_TEXT2);
  gfx.drawWideLine(cx + 4, cy, cx + 6, cy, 1.0, COL_TEXT2);
  gfx.drawWideLine(cx - 4, cy - 4, cx - 3, cy - 3, 1.0, COL_TEXT2);
  gfx.drawWideLine(cx + 3, cy + 3, cx + 4, cy + 4, 1.0, COL_TEXT2);
  gfx.drawWideLine(cx - 4, cy + 4, cx - 3, cy + 3, 1.0, COL_TEXT2);
  gfx.drawWideLine(cx + 3, cy - 3, cx + 4, cy - 4, 1.0, COL_TEXT2);
}

// ── PAGE DRAWING (line-for-line port of the .ino) ─────────
function drawFooter() {
  // Status dot: server reachability only, gated on STATE.wifiOk so it stays
  // blank whenever WiFi itself is down — that case is already covered by
  // drawWifiIcon() above. When WiFi is up: blinks once a second while the
  // most recent poll reached the server — green on the odd second, off on
  // the even second, so the pulse is easy to read at a glance. Static amber
  // when WiFi is fine but the poll still didn't reach the server (coasting
  // on cached data).
  const onPhase = Math.floor(performance.now() / 1000) % 2;
  if (STATE.wifiOk) {
    if (!STATE.connected) gfx.fillCircle(14, 230, 3, COL_ACCENT);
    else if (onPhase) gfx.fillCircle(14, 230, 4, COL_GOOD);
  }
  drawWifiIcon();
  drawSettingsIcon();

  const pageStr = (STATE.currentPage + 1) + ' / ' + PAGE_COUNT;
  gfx.setTextColor(COL_TEXT2);
  gfx.setTextSize(1);
  // Right-aligned just left of the settings gear (SETTINGS_HIT_X0), not the
  // panel edge, so the two never overlap.
  gfx.setCursor(SETTINGS_HIT_X0 - FOOTER_RIGHT_PADDING - pageStr.length * 6, 226);
  gfx.print(pageStr);

  const romPct = Math.round(FLASH_USED_BYTES / FLASH_TOTAL_BYTES * 100);
  const ramPct = Math.round(STATIC_RAM_BYTES / TOTAL_RAM_BYTES * 100);
  const cpuPct = Math.round(STATE.cpuPercentAvg);
  
  gfx.setTextSize(1);
  // 4px past the wifi icon's rightmost bar (28+2=30) — keeps the pulse dot,
  // wifi icon, and this activity readout each 4px apart.
  gfx.setCursor(34, 226);

  gfx.setTextColor(COL_TEXT2);
  gfx.print('CPU ');
  gfx.setTextColor(COL_TEXT);
  gfx.print(cpuPct + '%');
  gfx.setTextColor(COL_TEXT2);
  gfx.print('  ROM ');
  gfx.setTextColor(COL_TEXT);
  gfx.print(romPct + '%');
  gfx.setTextColor(COL_TEXT2);
  gfx.print('  RAM ');
  gfx.setTextColor(COL_TEXT);
  gfx.print(ramPct + '%');

  // Minimal 1px line along the bottom edge, filling left-to-right as the
  // next poll approaches (full width = fetch imminent).
  const pollMs = effectivePollMs();
  let elapsed = performance.now() - STATE.lastPollMs;
  if (elapsed > pollMs) elapsed = pollMs;
  const lineW = Math.floor(elapsed / pollMs * 320);  // firmware truncates, doesn't round
  if (lineW > 0) gfx.fillRect(0, 239, lineW, 1, COL_TEXT2);
}

// Small top-right corner overlay shown on every page whenever Battery Save is
// on -- twin of pages.cpp's drawBatterySaveIcon(); lockstep. A solid backing
// box behind the icon mirrors drawSessionResetOverlay()'s legibility
// treatment for the cat pages' unpredictable GIF backgrounds.
function drawBatterySaveIcon() {
  if (!batterySaveActive()) return;
  const boxX = 296, boxY = 2, boxW = 22, boxH = 13;
  gfx.fillRect(boxX, boxY, boxW, boxH, COL_BG);
  const bodyX = 300, bodyY = 5, bodyW = 13, bodyH = 7;
  const nubW = 2, nubH = 3;
  gfx.fillRect(bodyX, bodyY, bodyW, bodyH, COL_YELLOW);
  gfx.fillRect(bodyX + bodyW, bodyY + Math.floor((bodyH - nubH) / 2), nubW, nubH, COL_YELLOW);
}

// Percent track+fill. minFillPx is the smallest non-zero fill (3 for thick
// bars; h for thin mini-bars). Returns fill width or -1 when unknown.
function drawPercentBar(x, y, w, h, percent, color, trackColor = COL_TRACK, minFillPx = 3) {
  gfx.fillRect(x, y, w, h, trackColor);
  if (percent < 0) return -1;
  let fillW = Math.round(Math.min(percent, 100) / 100 * w);
  if (fillW < minFillPx) fillW = minFillPx;
  gfx.fillRect(x, y, fillW, h, color);
  return fillW;
}

// Live countdown: tick last server remaining-seconds by wall time since lastFetchOkMs.
function liveResetsInSec(baseSec) {
  if (baseSec < 0) return -1;
  let rem = baseSec - Math.floor((performance.now() - STATE.lastFetchOkMs) / 1000);
  return rem < 0 ? 0 : rem;
}

function drawLimitBlock(y, title, percent, resets, resetsInSec) {
  gfx.setTextColor(COL_TEXT);
  gfx.setTextSize(1);
  gfx.setCursor(10, y);
  gfx.print(title);

  const barX = 10, barY = y + 22, barW = 191, barH = 16;
  drawPercentBar(barX, barY, barW, barH, percent, COL_ACCENT);

  gfx.setTextColor(COL_TEXT);
  gfx.setTextSize(2);
  gfx.setCursor(211, barY + 1);
  gfx.print(percent >= 0 ? percent + '% used' : '--');

  gfx.setTextColor(COL_TEXT2);
  gfx.setTextSize(2);
  gfx.setCursor(10, barY + 26);
  let line = resets ? 'Resets ' + resets : 'Resets --';
  if (resets && resetsInSec >= 0) {
    line += ' (' + fmtCountdown(resetsInSec) + ')';
  }
  gfx.print(line);
}
// One row of the /usage-style limits page: label left, right-aligned value,
// thin 8px bar under. percent < 0 leaves the track empty (unknown).
function drawLimitsRow(y, label, right, percent) {
  gfx.setTextSize(1);
  gfx.setTextColor(COL_TEXT);
  gfx.setCursor(10, y);
  gfx.print(label);
  gfx.setTextColor(COL_TEXT2);
  gfx.setCursor(320 - right.length * 6, y);
  gfx.print(right);
  drawPercentBar(10, y + 12, 310, 8, percent, COL_ACCENT);
}

// "Resets Jul 16, 04:59  58%" — or bare "58%", or "--" when unknown.
function limitRowText(percent, resets) {
  if (percent < 0) return '--';
  return (resets ? 'Resets ' + resets + '  ' : '') + percent + '%';
}

// Limits page (index 4): Claude Code /usage panel — context, 5h, weekly,
// weekly per-model (hidden when null), credits. Rows shift up when absent.
function drawLimitsPage() {
  gfx.setTextColor(COL_TEXT);
  gfx.setTextSize(1);
  gfx.setCursor(10, 6);
  gfx.print('USAGE LIMITS');

  let y = 22;
  const ctx_ = STATE.ctxTokens >= 0
    ? fmtTokens(STATE.ctxTokens) + '  ' + STATE.ctxPercent + '%' : '--';
  drawLimitsRow(y, 'Context window', ctx_, STATE.ctxPercent); y += 40;

  drawLimitsRow(y, '5-hour limit',
    limitRowText(STATE.sessionPercent, STATE.sessionResets), STATE.sessionPercent); y += 40;

  drawLimitsRow(y, 'Weekly (all models)',
    limitRowText(STATE.weekPercent, STATE.weekResets), STATE.weekPercent); y += 40;

  if (STATE.weekModelPercent >= 0) {
    drawLimitsRow(y, 'Weekly (' + (STATE.weekModelName || 'model') + ')',
      limitRowText(STATE.weekModelPercent, STATE.weekModelResets), STATE.weekModelPercent); y += 40;
  }

  if (STATE.creditsUsed >= 0) {
    drawLimitsRow(y, 'Usage credits',
      fmtCost(STATE.creditsUsed) + ' of ' + fmtCost(STATE.creditsLimit),
      STATE.creditsPercent);
  }
}

function drawHomePage() {
  const sessionRem = liveResetsInSec(STATE.sessionResetsInSec);
  // Week has no countdown suffix here: its "Resets <date>" string is already
  // close to the line's pixel budget (see drawLimitsCard's size1 note below),
  // so appending " (HHh:MMm)" would overflow the 320px screen.
  drawLimitBlock(10, 'Current session', STATE.sessionPercent, STATE.sessionResets, sessionRem);
  drawLimitBlock(104, 'Current week (all models)', STATE.weekPercent, STATE.weekResets, -1);

  // ₿ has no glyph in the built-in ASCII font: print "B" and add the two
  // vertical strokes piercing its top and bottom (size-2 glyph = 10x14 px).
  gfx.setTextColor(COL_TEXT);
  gfx.setTextSize(2);
  gfx.setCursor(10, 198);
  gfx.print('B');
  gfx.fillRect(12, 195, 2, 3, COL_TEXT);
  gfx.fillRect(16, 195, 2, 3, COL_TEXT);
  gfx.fillRect(12, 212, 2, 3, COL_TEXT);
  gfx.fillRect(16, 212, 2, 3, COL_TEXT);
  gfx.print(' $' + fmtBtc(STATE.btcPrice));
}

// Combined page: top 4 projects (7d) in the upper half, the 7-day token trend
// chart in the lower half (formerly its own page). A 1px divider at y=128
// splits the two sections; the trend labels end at y=226, just above the
// footer dots at y=230.
function drawProjectsPage() {
  // ── upper half: top projects (7d) ──
  gfx.setTextColor(COL_TEXT);
  gfx.setTextSize(1);
  gfx.setCursor(10, 6);
  gfx.print('TOP PROJECTS (7D)');

  if (STATE.projects.length === 0) {
    gfx.setTextColor(COL_TEXT2);
    gfx.setCursor(10, 24);
    gfx.print('No data yet');
  } else {
    const shown = Math.min(STATE.projects.length, 4);
    let maxTokens = 1;
    for (let i = 0; i < shown; i++) if (STATE.projects[i].tokens > maxTokens) maxTokens = STATE.projects[i].tokens;

    let y = 22;
    const barMaxW = 246;
    for (let i = 0; i < shown; i++) {
      const p = STATE.projects[i];
      gfx.setTextColor(COL_TEXT);
      gfx.setTextSize(1);
      gfx.setCursor(10, y);
      gfx.print(p.name);

      const barW = Math.floor(p.tokens / maxTokens * barMaxW);  // firmware truncates
      gfx.fillRect(10, y + 10, barMaxW, 8, COL_SURFACE);
      gfx.fillRect(10, y + 10, Math.max(barW, 4), 8, COL_ACCENT);

      gfx.setTextColor(COL_TEXT2);
      gfx.setCursor(10 + barMaxW + 8, y + 11);
      gfx.print(fmtTokens(p.tokens));

      y += 26;
    }
  }

  // ── lower half: 7-day trend ──
  gfx.fillRect(10, 128, 310, 1, COL_BORDER);
  gfx.setTextColor(COL_TEXT);
  gfx.setTextSize(1);
  gfx.setCursor(10, 134);
  gfx.print('7-DAY TREND');

  let maxTrend = 1;
  for (const v of STATE.trend) if (v > maxTrend) maxTrend = v;

  const dayLabels = ['-6', '-5', '-4', '-3', '-2', '-1', 'today'];
  const chartX = 24, chartY = 150, chartH = 64, barW = 34, gap = 8;
  for (let i = 0; i < 7; i++) {
    const barH = Math.floor(STATE.trend[i] / maxTrend * chartH);  // firmware truncates
    const bx = chartX + i * (barW + gap);
    const by = chartY + chartH - barH;
    gfx.fillRoundRect(bx, by, barW, Math.max(barH, 2), 3, COL_ACCENT);
    gfx.setTextColor(COL_TEXT2);
    gfx.setTextSize(1);
    gfx.setCursor(bx, chartY + chartH + 4);
    gfx.print(dayLabels[i]);
  }
}

// Simple vector weather icon (line-for-line port of the firmware's
// drawWeatherIcon), mapped from Open-Meteo's WMO weather_code.
// Scaled down (~0.65x) from the original so the weather card can shrink to
// the clock card's short bottom-row height (see drawStatusPage).
function drawWeatherIcon(x, y, code) {
  if (code < 0) {
    gfx.setTextColor(COL_TEXT2);
    gfx.setTextSize(1);
    gfx.setCursor(x, y + 4);
    gfx.print('--');
    return;
  }
  const cx = x + 8, cy = y + 7;
  if (code === 0 || code === 1) {
    // clear: sun disc + 8 short rounded rays (cardinals then diagonals),
    // with a 2-3px gap between disc and rays so they read as separate.
    gfx.fillCircle(cx, cy, 4, COL_YELLOW);
    gfx.drawWideLine(cx, cy - 9, cx, cy - 7, 1, COL_YELLOW);
    gfx.drawWideLine(cx, cy + 7, cx, cy + 9, 1, COL_YELLOW);
    gfx.drawWideLine(cx - 9, cy, cx - 7, cy, 1, COL_YELLOW);
    gfx.drawWideLine(cx + 7, cy, cx + 9, cy, 1, COL_YELLOW);
    gfx.drawWideLine(cx - 7, cy - 7, cx - 5, cy - 5, 1, COL_YELLOW);
    gfx.drawWideLine(cx + 5, cy + 5, cx + 7, cy + 7, 1, COL_YELLOW);
    gfx.drawWideLine(cx - 7, cy + 7, cx - 5, cy + 5, 1, COL_YELLOW);
    gfx.drawWideLine(cx + 5, cy - 5, cx + 7, cy - 7, 1, COL_YELLOW);
    return;
  }
  // Rain/snow/lightning are drawn standalone (no cloud underneath) so the
  // condition itself reads clearly at this icon's small size — a cloud
  // sharing the space with a tiny overlay was too cluttered to tell apart.
  if (code >= 95) {
    // thunderstorm: zigzag bolt — a Material-style hexagon polygon
    // (bottom tip, notch, top prong) split into 4 fillTriangle calls
    // since the GFX API has no filled-polygon primitive. Vertices:
    // A(-1,+8) B(-1,+2) C(-5,+2) D(+1,-8) E(+1,-2) F(+5,-2).
    gfx.fillTriangle(cx - 5, cy + 2, cx + 1, cy - 8, cx + 1, cy - 2, COL_YELLOW);
    gfx.fillTriangle(cx - 5, cy + 2, cx + 1, cy - 2, cx - 1, cy + 2, COL_YELLOW);
    gfx.fillTriangle(cx - 1, cy + 2, cx + 1, cy - 2, cx + 5, cy - 2, COL_YELLOW);
    gfx.fillTriangle(cx - 1, cy + 2, cx + 5, cy - 2, cx - 1, cy + 8, COL_YELLOW);
    return;
  }
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) {
    // snow: six-armed snowflake = three rounded lines crossing at 60deg
    gfx.drawWideLine(cx, cy - 7, cx, cy + 7, 1, COL_TEXT);
    gfx.drawWideLine(cx - 6, cy - 4, cx + 6, cy + 4, 1, COL_TEXT);
    gfx.drawWideLine(cx - 6, cy + 4, cx + 6, cy - 4, 1, COL_TEXT);
    return;
  }
  if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) {
    // rain: three staggered teardrops (triangle cap fused onto a circle),
    // two small on top, one large below — classic rain glyph.
    gfx.fillTriangle(cx - 6, cy - 8, cx - 8, cy - 3, cx - 4, cy - 3, COL_BLUE);
    gfx.fillCircle(cx - 6, cy - 3, 2, COL_BLUE);
    gfx.fillTriangle(cx + 5, cy - 6, cx + 3, cy - 1, cx + 7, cy - 1, COL_BLUE);
    gfx.fillCircle(cx + 5, cy - 1, 2, COL_BLUE);
    gfx.fillTriangle(cx - 1, cy + 1, cx - 4, cy + 6, cx + 2, cy + 6, COL_BLUE);
    gfx.fillCircle(cx - 1, cy + 6, 3, COL_BLUE);
    return;
  }
  // Everything else shares a plain cloud (2/3/45/48 = cloudy/fog, or any
  // unmapped code): two overlapping puffs on a fully-rounded pill base.
  gfx.fillCircle(cx - 4, cy - 2, 4, COL_TEXT2);
  gfx.fillCircle(cx + 3, cy - 3, 5, COL_TEXT2);
  gfx.fillRoundRect(cx - 9, cy - 2, 19, 9, 4, COL_TEXT2);
}

// Thin inset progress bar (min fill = bar height). Returns fill width for shine.
function drawMiniBar(x, y, w, percent, color, trackColor = COL_TRACK, h = 6) {
  return drawPercentBar(x, y, w, h, percent, color, trackColor, h);
}

// ── SHINE SWEEP ────────────────────────────────────────────
// Looping light band on status/mixed green reset-countdown bars. Twin of
// pages.cpp's drawShineStrip; the 20fps tick() makes it glide (firmware
// tops up between 1Hz renders via shineTick()).
const SHINE_PERIOD_MS = 2600;
const SHINE_BAND_R = 7;
const SHINE_BAR_W = 137, SHINE_BAR_H = 4;

// Interior columns only (2..fillW-3, full height) so the radius-2 rounded
// ends stay untouched; repainting non-band columns COL_GOOD erases the trail.
function drawShineStrip(x, y, fillW, nowMs) {
  if (fillW < 12) return;
  const phase = (nowMs % SHINE_PERIOD_MS) / SHINE_PERIOD_MS;
  const center = -SHINE_BAND_R + Math.floor(phase * (SHINE_BAR_W + 2 * SHINE_BAND_R));
  for (let i = 2; i <= fillW - 3; i++) {
    const d = Math.abs(i - center);
    const c = d <= 1 ? COL_SHINE_HI : d <= 4 ? COL_SHINE_MID : d <= SHINE_BAND_R ? COL_SHINE_LO : COL_GOOD;
    gfx.fillRect(x + i, y, 1, SHINE_BAR_H, c);
  }
}

// Uppercase section label.
function drawCardLabel(x, y, label) {
  gfx.setTextColor(COL_TEXT2);
  gfx.setTextSize(1);
  gfx.setCursor(x, y);
  gfx.print(label);
}

const SESSION_WINDOW_SEC = 5 * 3600;        // 5h
const WEEK_WINDOW_SEC = 7 * 24 * 3600;      // 168h

// Reset-countdown fill: 0% right after a reset, 100% right before the next
// one. `remainingSec` is the live countdown (already ticked down locally
// between polls); `windowSec` is the fixed window length (5h or 168h).
function elapsedPercentOfWindow(remainingSec, windowSec) {
  if (remainingSec < 0) return -1;
  const elapsed = Math.max(0, windowSec - remainingSec);
  return Math.min(100, Math.max(0, Math.round(elapsed * 100 / windowSec)));
}

// Card layout: one tall left card = session/week limits (always accent
// orange); the right column is Bangkok analog clock (own row) + digital
// clock/date (row below), then weather + BTC cards. Left (limits) and
// right (clock/weather/BTC) columns are sized 50:50 of the 320px screen:
// left card x=2 w=155 (edge 157), right column x=163 w=155 (edge 318), a
// 6px gap between them mirroring the 2px margins at the screen's own edges.
function drawLimitsCard() {
  // Two separate cards (5h / week) with a 2px gap between them, rather than
  // one tall card split by an internal divider line (all card-to-card gaps
  // on this page are 2px — see drawStatusPage's comment). Card height grew
  // by the space freed from shrinking the old 4-6px gaps down to 2px, giving
  // the content a bit more breathing room instead of just bottom padding.
  gfx.fillRect(2, 2, 157, 99, COL_SURFACE);
  gfx.drawRect(2, 2, 157, 99, COL_BORDER);
  gfx.fillRect(2, 103, 157, 87, COL_SURFACE);
  gfx.drawRect(2, 103, 157, 87, COL_BORDER);

  let sessionRem = liveResetsInSec(STATE.sessionResetsInSec);
  let weekRem = liveResetsInSec(STATE.weekResetsInSec);

  // ── left card: limits ──
  const sessionPctStr = STATE.sessionPercent >= 0 ? STATE.sessionPercent + '%' : '--';
  gfx.setTextColor(COL_ACCENT);
  gfx.setTextSize(3);
  gfx.setCursor(12, 11);
  gfx.print(sessionPctStr);
  drawCardLabel(12 + sessionPctStr.length * 18 + 6, 27, '5H');

  drawMiniBar(12, 41, 137, STATE.sessionPercent, COL_ACCENT);
  // Green reset-countdown bars (and shine) optional via Settings "Show Countdown".
  if (STATE.cfgShowCountdown) {
    const sessionFillW = drawMiniBar(12, 51, 137, elapsedPercentOfWindow(sessionRem, SESSION_WINDOW_SEC), COL_GOOD, COL_TRACK_BLACK, 4);
    drawShineStrip(12, 51, sessionFillW, performance.now());
  }

  gfx.setTextColor(COL_TEXT2);
  gfx.setTextSize(2);
  gfx.setCursor(12, 59);
  gfx.print(STATE.sessionResets ? 'resets ' + STATE.sessionResets : 'resets --');
  gfx.setTextColor(COL_TEXT);
  gfx.setTextSize(2);
  gfx.setCursor(12, 77);
  if (sessionRem >= 0) gfx.print('in ' + fmtCountdown(sessionRem));

  const weekPctStr = STATE.weekPercent >= 0 ? STATE.weekPercent + '%' : '--';
  gfx.setTextColor(COL_ACCENT);
  gfx.setTextSize(3);
  gfx.setCursor(12, 110);
  gfx.print(weekPctStr);
  drawCardLabel(12 + weekPctStr.length * 18 + 6, 126, 'WEEK');

  drawMiniBar(12, 140, 137, STATE.weekPercent, COL_ACCENT);
  if (STATE.cfgShowCountdown) {
    const weekFillW = drawMiniBar(12, 150, 137, elapsedPercentOfWindow(weekRem, WEEK_WINDOW_SEC), COL_GOOD, COL_TRACK_BLACK, 4);
    drawShineStrip(12, 150, weekFillW, performance.now());
  }

  // "resets Jul 9, 4:59am" is 20 chars = 120px at size1 — comfortably under the
  // card's inner width, so this line must stay size1.
  gfx.setTextColor(COL_TEXT2);
  gfx.setTextSize(1);
  gfx.setCursor(12, 164);
  gfx.print(STATE.weekResets ? 'resets ' + STATE.weekResets : 'resets --');

  gfx.setTextColor(COL_TEXT);
  gfx.setTextSize(1);
  gfx.setCursor(12, 174);
  if (weekRem >= 0) gfx.print('in ' + fmtCountdownDHM(weekRem));
}

// BTC price card: sits directly under the week card in the left column,
// using the same 2px-gap convention as the rest of the page (see
// drawStatusPage's comment). Shared by drawStatusPage and drawMixedPage so
// both pages show the same in-line "BTCUSDT <price>" card.
function drawBtcCard() {
  gfx.fillRect(2, 192, 157, 26, COL_SURFACE);
  gfx.drawRect(2, 192, 157, 26, COL_BORDER);

  gfx.setTextColor(COL_TEXT2);
  gfx.setTextSize(1);
  gfx.setCursor(12, 201);

  gfx.setTextColor(COL_TEXT);
  gfx.setTextSize(2);
  gfx.setCursor(60, 197);
  gfx.print(fmtBtc(STATE.btcPrice));
}

// Filled pie wedge from the hour hand's current angle clockwise to the
// reset angle, at 50% opacity green — a "time remaining" region layered
// under the ticks/hands so they stay legible on top. `startRad`/`endRad`
// are in the same screen-space radians as the hand angles below (canvas
// arc() already sweeps clockwise for increasing angle, matching the
// clock's own -90°-offset convention, so no extra sign flip is needed).
// True alpha here vs. pages.cpp's drawTimerWedge: LovyanGFX has no real
// alpha blending on this RGB565 display, so the firmware twin uses a
// precomputed solid blend color (COL_GOOD lerped 50% into COL_BG) instead.
const COL_GOOD_50 = 'rgba(33,206,66,0.5)'; // COL_GOOD @ 50% alpha
function drawTimerWedge(cx, cy, r, startRad, endRad) {
  let delta = (endRad - startRad) % (2 * Math.PI);
  if (delta < 0) delta += 2 * Math.PI;
  ctx.save();
  ctx.fillStyle = COL_GOOD_50;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, r, startRad, startRad + delta, false);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// Minimal analog clock: a bare circle, 12/3/6/9 tick dots, and hour/minute
// hands — no numerals, no second hand. Angles are screen-space (y grows
// down) with a -90° offset so 0 minutes/hours points straight up (12
// o'clock); increasing angle then sweeps clockwise on screen, matching a
// real clock face.
function drawAnalogClock(cx, cy, r, hour24, minute, second, haveReset, resetHour24, resetMinute) {
  const hourAngle = ((hour24 % 12) + minute / 60) * 30 - 90;
  const minAngle = (minute + second / 60) * 6 - 90;
  const secAngle = second * 6 - 90;
  const hourRad = hourAngle * Math.PI / 180;
  const minRad = minAngle * Math.PI / 180;
  const secRad = secAngle * Math.PI / 180;

  // Timer region: hour hand -> next 5h reset, drawn first so the circle,
  // ticks, and hands all render crisply on top of the translucent fill.
  // Gated by Settings "Show Countdown"; the green reset hand below always draws.
  if (haveReset && STATE.cfgShowCountdown) {
    const resetAngle = ((resetHour24 % 12) + resetMinute / 60) * 30 - 90;
    const resetRad = resetAngle * Math.PI / 180;
    drawTimerWedge(cx, cy, r - 1, hourRad, resetRad);
  }

  gfx.drawCircle(cx, cy, r, COL_TEXT);
  // 12 short hour ticks radiating in from the rim, same -90° zero-at-top
  // convention as the hands below.
  for (let i = 0; i < 12; i++) {
    const tickRad = (i * 30 - 90) * Math.PI / 180;
    const x0 = cx + Math.cos(tickRad) * (r - 1);
    const y0 = cy + Math.sin(tickRad) * (r - 1);
    const x1 = cx + Math.cos(tickRad) * (r - 5);
    const y1 = cy + Math.sin(tickRad) * (r - 5);
    gfx.drawLine(x0, y0, x1, y1, COL_TEXT);
  }

  const hx = cx + Math.cos(hourRad) * r * 0.5;
  const hy = cy + Math.sin(hourRad) * r * 0.5;
  const mx = cx + Math.cos(minRad) * r * 0.8;
  const my = cy + Math.sin(minRad) * r * 0.8;
  const sx = cx + Math.cos(secRad) * (r - 2);
  const sy = cy + Math.sin(secRad) * (r - 2);

  // Hour/minute hands drawn wide (wedge lines) for a bolder look. The second
  // hand is thinner but still a wideLine (not a hard 1px drawLine) and
  // reaches out to the same (r-2) radius as the reset line/wedge rim below --
  // a plain thin drawLine stopping at r*0.9 left a few px of the timer wedge
  // exposed past the hand's tip near the rim, reading as the green area
  // sitting on top of the second hand instead of the other way around.
  gfx.drawWideLine(cx, cy, hx, hy, 2.0, COL_TEXT);
  gfx.drawWideLine(cx, cy, mx, my, 1.5, COL_TEXT);

  // Session (5h) reset time: a thin green radius from center to rim, static
  // (unlike the hands) at whatever hour/minute the session next resets.
  // Drawn before the second hand (below) so the sweeping second hand stays
  // visible on top of it when the two overlap, instead of being masked by it.
  if (haveReset) {
    const resetAngle = ((resetHour24 % 12) + resetMinute / 60) * 30 - 90;
    const resetRad = resetAngle * Math.PI / 180;
    const rx = cx + Math.cos(resetRad) * (r - 2);
    const ry = cy + Math.sin(resetRad) * (r - 2);
    gfx.drawLine(cx, cy, rx, ry, COL_GOOD);
  }

  gfx.drawWideLine(cx, cy, sx, sy, 1.0, COL_ACCENT);
  gfx.fillCircle(cx, cy, 2, COL_TEXT);
}

// AQI badge colors, per the standard US EPA / aqicn.org scale. Background
// hues are fixed by that scale; fg picked per-box by actual WCAG contrast
// ratio (relative luminance, not a hue guess) -- most of these boxes are
// bright/saturated enough that black text reads far better than white:
// Good 9.97:1 black vs 2.11:1 white, Unhealthy 5.43:1 vs 3.87:1 (white fails
// AA's 4.5:1), Very Unhealthy 5.31:1 vs 3.96:1 (white fails AA too). Only
// Hazardous's dark maroon flips the winner back to white (10.02:1 vs a poor
// 2.10:1 for black). Mirrors the firmware's aqiColors() in pages.cpp exactly.
function aqiColors(aqi) {
  if (aqi <= 50) return { bg: COL_GOOD, fg: COL_TRACK_BLACK };        // Good
  if (aqi <= 100) return { bg: COL_YELLOW, fg: COL_TRACK_BLACK };     // Moderate
  if (aqi <= 150) return { bg: COL_AQI_ORANGE, fg: COL_TRACK_BLACK }; // Unhealthy for Sensitive Groups
  if (aqi <= 200) return { bg: COL_WARN, fg: COL_TRACK_BLACK };       // Unhealthy
  if (aqi <= 300) return { bg: COL_PURPLE, fg: COL_TRACK_BLACK };     // Very Unhealthy
  return { bg: COL_MAROON, fg: COL_TEXT };                            // Hazardous
}

function drawStatusPage() {
  drawLimitsCard();
  drawBtcCard();
  gfx.fillRect(161, 2, 157, 162, COL_SURFACE);
  gfx.drawRect(161, 2, 157, 162, COL_BORDER);
  gfx.fillRect(161, 166, 157, 52, COL_SURFACE);
  gfx.drawRect(161, 166, 157, 52, COL_BORDER);

  // ── right cards: Bangkok analog + digital clock/date, weather, BTC price ──
  const bkk = bangkokParts();

  const sessionRem = liveResetsInSec(STATE.sessionResetsInSec);
  const haveReset = !!bkk && sessionRem >= 0;
  let resetHour = 0, resetMinute = 0;
  if (haveReset) {
    const totalSec = (parseInt(bkk.hour, 10) * 3600 + parseInt(bkk.minute, 10) * 60 + parseInt(bkk.second, 10) + sessionRem) % 86400;
    resetHour = Math.floor(totalSec / 3600);
    resetMinute = Math.floor((totalSec % 3600) / 60);
  }

  // Row 1: analog clock, centered on the card's full width. Radius grew
  // 36->44->48->51, the latest bump using the height freed by tightening
  // the gap between the digital time and date rows below from 8px to 2px.
  const clockCx = 240, clockCy = 61, clockR = 51;
  if (bkk) {
    drawAnalogClock(clockCx, clockCy, clockR, parseInt(bkk.hour, 10), parseInt(bkk.minute, 10), parseInt(bkk.second, 10),
                     haveReset, resetHour, resetMinute);
  } else {
    gfx.drawCircle(clockCx, clockCy, clockR, COL_TEXT);
  }

  // Row 2: digital time + date, both centered on the card's horizontal
  // midline (241, matching clockCx) since their text width varies with
  // content. Digital time dropped from size4 to size3 to free up vertical
  // room for the bigger analog clock above; date stays size2.
  gfx.setTextSize(3);
  const hmText = bkk ? (bkk.hour + ':' + bkk.minute) : '--:--';
  gfx.setCursor(240 - gfx.textWidth(hmText) / 2, 116);
  if (bkk) {
    gfx.setTextColor(COL_TEXT);
  } else {
    gfx.setTextColor(COL_TEXT2);
  }
  gfx.print(hmText);

  gfx.setTextColor(COL_TEXT2);
  gfx.setTextSize(2);
  // Year dropped: "Mon 25 Jul 2026" at size2 would overrun the 132px inner
  // width; weekday+day+month fits at 120px.
  const dateText = bkk ? (bkk.weekday + ' ' + bkk.day + ' ' + bkk.month) : '--';
  const dateW = gfx.textWidth(dateText);

  // AQI badge: a colored box (aqiColors() above) appended after the date,
  // e.g. "Mon 3 Aug [81]". Skipped when the Mac hasn't delivered a reading
  // yet (STATE.aqi < 0) rather than drawing a placeholder in a made-up color.
  const haveAqi = bkk && STATE.cfgShowAqi && STATE.aqi >= 0;
  const aqiText = haveAqi ? String(STATE.aqi) : '';
  const badgeW = haveAqi ? aqiText.length * 6 * 2 + 6 : 0;  // size2 digits + 3px pad each side
  const gap = haveAqi ? 4 : 0;
  const startX = 240 - (dateW + gap + badgeW) / 2;

  gfx.setCursor(startX, 142);
  gfx.print(dateText);

  if (haveAqi) {
    const { bg, fg } = aqiColors(STATE.aqi);
    const bx = startX + dateW + gap;
    gfx.fillRoundRect(bx, 140, badgeW, 20, 3, bg);
    gfx.setTextSize(2);
    gfx.setTextColor(fg);
    gfx.setCursor(bx + 3, 142);
    gfx.print(aqiText);
  }

  // 1px divider between the "now" icon+temp block and the next-3-hours
  // forecast to its right, centered in the existing gap so it doesn't
  // touch either side's text/icons. (No matching divider on the left —
  // the high/low column reads fine as plain whitespace-separated numbers,
  // and skipping it keeps this side less cluttered.) Sized with an even
  // 6px pad above/below within the taller (52px) card, rather than just
  // shifting the old 34px line, so it uses the extra height freed by the
  // page-wide 2px-gap pass instead of leaving it as dead space.
  gfx.fillRect(215, 172, 1, 40, COL_BORDER);

  // Today's high/low, in the gap between the card's left edge and the
  // "now" icon — no room for "H"/"L" letter prefixes at this width, so
  // bare numbers stacked high-over-low (bright/grey, same primary-vs-
  // secondary color convention as the rest of the UI) is what fits. x=167
  // leaves a visible left margin (rather than sitting flush against the
  // card border). Rows line up with the icon (top) and temp (bottom)
  // beside them.
  gfx.setTextSize(1);
  gfx.setCursor(167, 173);
  gfx.setTextColor(COL_TEXT);
  gfx.print(STATE.weatherHigh > -900 ? STATE.weatherHigh : '--');
  gfx.setCursor(167, 198);
  gfx.setTextColor(COL_TEXT2);
  gfx.print(STATE.weatherLow > -900 ? STATE.weatherLow : '--');

  // Weather card: icon and temp stacked (rather than side by side) since
  // the "now" block was originally sized for a 60px-wide card. The smaller
  // icon (see drawWeatherIcon) is what lets this block fit in the card's
  // height with icon-top-then-temp still snug against both edges. Both are
  // horizontally centered between the high/low column and the divider to
  // the right (x=197), rather than left-anchored, so the block reads as
  // its own column instead of hugging the high/low numbers.
  const NOW_CENTER_X = 197;
  drawWeatherIcon(NOW_CENTER_X - 8, 174, STATE.weatherCode);
  gfx.setTextColor(COL_TEXT);
  gfx.setTextSize(2);
  if (STATE.weatherTempC > -900) {
    const tempStr = String(Math.round(STATE.weatherTempC));
    const tw = tempStr.length * 12 + 6;  // digits at size2 + "C" at size1
    gfx.setCursor(NOW_CENTER_X - Math.floor(tw / 2), 194);
    gfx.print(tempStr);
    gfx.setTextSize(1);
    gfx.setTextColor(COL_TEXT2);
    gfx.print('C');
  } else {
    gfx.setCursor(NOW_CENTER_X - 12, 194);  // "--" at size2 = 24px wide
    gfx.print('--');
  }

  // "Next 3 hours" forecast: three distinct hourly predictions (not just a
  // single reading further out), filling the space freed when the weather
  // card widened to take over the row the BTC card used to share.
  // weatherHourly[] is 1h-stepped starting at the *current* hour (index 0,
  // already shown by the "now" block above), so indices 1..3 are the next
  // three hours. Column layout (hour label, icon, temp) mirrors the
  // Weather page's hourly strip (see drawWeatherPage below). Slot 0 starts
  // close enough to the right divider (x=215) that its icon clears it by
  // only ~5px, closing up the wide gap that used to sit between the "now"
  // temp and the first forecast column.
  const NEXT_HOUR_SLOT_X = 214, NEXT_HOUR_SLOT_W = 30;
  for (let i = 0; i < 3; i++) {
    const idx = i + 1;
    const sx = NEXT_HOUR_SLOT_X + i * NEXT_HOUR_SLOT_W;
    const cx = sx + Math.floor(NEXT_HOUR_SLOT_W / 2);
    const slot = STATE.weatherHourly.length > idx ? STATE.weatherHourly[idx] : null;

    gfx.setTextColor(COL_TEXT2);
    gfx.setTextSize(1);
    gfx.setCursor(cx - 6, 171);
    gfx.print(slot ? String(slot.h).padStart(2, '0') : '--');

    drawWeatherIcon(cx - 8, 183, slot ? slot.code : -1);

    const tbuf = slot ? slot.tempC + 'C' : '--';
    const tw = tbuf.length * 6;
    gfx.setTextColor(COL_TEXT);
    gfx.setCursor(cx - Math.floor(tw / 2), 201);
    gfx.print(tbuf);
  }
}

// Weather detail overlay — twin of pages.cpp drawWeatherPage; lockstep.
// No place / HOURLY / 5-DAY word labels; freed height → larger daily dayStep.
function drawWeatherPage() {
  gfx.fillScreen(COL_BG);

  const WDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const heroRight = 312;  // card right pad (10+310-8)

  // ── Hero card ────────────────────────────────────────────
  // (10, 4, 310, 52) — single inline band fills the card:
  //   icon | size5 temp | size2 condition + size2 H/L
  // Icon leads on the far left, immediately before the current temp.
  gfx.fillRect(10, 4, 310, 52, COL_SURFACE);
  gfx.drawRect(10, 4, 310, 52, COL_BORDER);

  // Icon far left, vertically centered in the 52px card (~14–16px tall).
  const iconX = 16;
  drawWeatherIcon(iconX, 22, STATE.weatherCode);
  const tempX = iconX + 22;  // past icon box (~18) + gutter

  let metaX = 100;
  gfx.setTextSize(5);
  gfx.setCursor(tempX, 10);
  if (STATE.weatherTempC > -900) {
    const tbuf = String(Math.round(STATE.weatherTempC));
    gfx.setTextColor(COL_TEXT);
    gfx.print(tbuf);
    const tw = tbuf.length * 30;  // size5 advance
    gfx.setTextSize(2);
    gfx.setTextColor(COL_TEXT2);
    gfx.setCursor(tempX + tw, 12);
    gfx.print('o');
    metaX = tempX + tw + 20;  // past degree + clear gutter into meta column
  } else {
    gfx.setTextColor(COL_TEXT2);
    gfx.print('--');
    metaX = tempX + 2 * 30 + 16;
  }

  // AQI badge (same aqiColors() styling as the status page's date-row badge)
  // pinned to the hero card's top-right corner -- this page has no digital
  // date row to hang it off of, so the corner is the equivalent "top-right
  // of the page" spot. Computed before metaMaxX so the condition text
  // truncates around it instead of running underneath.
  const haveAqi = STATE.cfgShowAqi && STATE.aqi >= 0;
  let aqiBuf = '';
  let badgeW = 0;
  if (haveAqi) {
    aqiBuf = String(STATE.aqi);
    badgeW = aqiBuf.length * 6 * 2 + 6;  // size2 digits + 3px pad each side
  }
  const metaMaxX = heroRight - (haveAqi ? badgeW + 6 : 0);

  // Condition (size2) — top of meta column, optically with upper temp.
  {
    const hasCond = !!STATE.weatherCondition;
    const cond = hasCond ? STATE.weatherCondition : '--';
    let avail = metaMaxX - metaX;
    if (avail < 12) avail = 12;
    let maxChars = Math.floor(avail / 12);  // size2 = 12px/char
    if (maxChars > 14) maxChars = 14;
    if (maxChars < 1) maxChars = 1;
    const cbuf = cond.slice(0, maxChars);
    gfx.setTextSize(2);
    gfx.setTextColor(hasCond ? COL_TEXT : COL_TEXT2);
    gfx.setCursor(metaX, 14);
    gfx.print(cbuf);
  }

  // High / Low (size2) — "H 35  L 26", same column under condition.
  {
    const hStr = STATE.weatherHigh > -900 ? String(STATE.weatherHigh) : '--';
    const lStr = STATE.weatherLow > -900 ? String(STATE.weatherLow) : '--';
    gfx.setTextSize(2);
    let x = metaX;
    gfx.setTextColor(COL_TEXT2);
    gfx.setCursor(x, 36);
    gfx.print('H ');           // label + space (2 cells)
    x += 24;
    gfx.setTextColor(COL_TEXT);
    gfx.setCursor(x, 36);
    gfx.print(hStr);
    x += hStr.length * 12 + 18;  // value + inter-pair gap
    gfx.setTextColor(COL_TEXT2);
    gfx.setCursor(x, 36);
    gfx.print('L ');
    x += 24;
    gfx.setTextColor(COL_TEXT);
    gfx.setCursor(x, 36);
    gfx.print(lStr);
  }

  if (haveAqi) {
    const { bg, fg } = aqiColors(STATE.aqi);
    const bx = heroRight - badgeW;
    gfx.fillRoundRect(bx, 8, badgeW, 20, 3, bg);
    gfx.setTextSize(2);
    gfx.setTextColor(fg);
    gfx.setCursor(bx + 3, 10);
    gfx.print(aqiBuf);
  }

  // ── Hourly (next 6) — no "HOURLY" label ──────────────────
  gfx.fillRect(10, 60, 310, 56, COL_SURFACE);
  gfx.drawRect(10, 60, 310, 56, COL_BORDER);

  const hourCount = STATE.weatherHourly.length > 0
    ? STATE.weatherHourly.length : WEATHER_HOURLY_N;
  const slotW = 51;
  for (let i = 0; i < hourCount && i < WEATHER_HOURLY_N; i++) {
    const sx = 12 + i * slotW;
    const cx = sx + Math.floor(slotW / 2);
    const slot = STATE.weatherHourly[i];
    const have = !!slot;
    const hour = have ? slot.h : -1;
    const temp = have ? slot.tempC : 0;
    const code = have ? slot.code : -1;

    if (i === 0) {
      gfx.fillRoundRect(sx + 6, 62, slotW - 12, 2, 1, COL_ACCENT);
    }

    gfx.setTextSize(1);
    gfx.setTextColor(i === 0 ? COL_ACCENT : COL_TEXT2);
    const hbuf = (have && hour >= 0)
      ? String(hour).padStart(2, '0') : '--';
    gfx.setCursor(cx - 6, 66);
    gfx.print(hbuf);

    drawWeatherIcon(cx - 8, 78, code);

    if (have) {
      const tbuf = String(temp);
      const tw = tbuf.length * 6;
      gfx.setTextColor(COL_TEXT);
      gfx.setCursor(cx - Math.floor(tw / 2), 102);
      gfx.print(tbuf);
    } else {
      gfx.setTextColor(COL_TEXT2);
      gfx.setCursor(cx - 6, 102);
      gfx.print('--');
    }
  }

  // ── 5-day — no "5-DAY" label; extra height → larger dayStep ─
  gfx.fillRect(10, 122, 310, 114, COL_SURFACE);
  gfx.drawRect(10, 122, 310, 114, COL_BORDER);

  let minT = 100, maxT = -100;
  for (const d of STATE.weatherDaily) {
    if (d.low < minT) minT = d.low;
    if (d.high > maxT) maxT = d.high;
  }
  if (maxT <= minT) { minT = 20; maxT = 40; }

  // dayStep 22: 5×22 = 110 inside 114px card (was 15 in 78px).
  const dayY0 = 126;
  const dayStep = 22;
  const barX = 96, barW = 176, barH = 6;
  const dayCount = STATE.weatherDaily.length > 0
    ? STATE.weatherDaily.length : WEATHER_DAILY_N;
  for (let i = 0; i < dayCount && i < WEATHER_DAILY_N; i++) {
    const y = dayY0 + i * dayStep;
    const day = STATE.weatherDaily[i];
    const have = !!day;
    const wd = have ? day.wd : -1;
    const lo = have ? day.low : 0;
    const hi = have ? day.high : 0;
    const code = have ? day.code : -1;

    const textY = y + 7;
    const barY = y + 8;
    const iconY = y + 4;

    gfx.setTextSize(1);
    gfx.setTextColor(i === 0 ? COL_ACCENT : COL_TEXT);
    gfx.setCursor(18, textY);
    gfx.print((have && wd >= 0 && wd < 7) ? WDAYS[wd] : '---');

    drawWeatherIcon(44, iconY, code);

    const lbuf = have ? String(lo) : '--';
    const hbuf = have ? String(hi) : '--';

    gfx.setTextColor(COL_TEXT2);
    gfx.setCursor(barX - 6 - lbuf.length * 6, textY);
    gfx.print(lbuf);

    gfx.fillRect(barX, barY, barW, barH, COL_TRACK);
    if (have && maxT > minT) {
      const span = maxT - minT;
      let x0 = barX + Math.floor((lo - minT) / span * barW);  // firmware truncates
      let x1 = barX + Math.floor((hi - minT) / span * barW);  // firmware truncates
      if (x1 - x0 < barH) x1 = x0 + barH;
      gfx.fillRect(x0, barY, x1 - x0, barH, COL_ACCENT);
    }

    gfx.setTextColor(COL_TEXT);
    gfx.setCursor(barX + barW + 6, textY);
    gfx.print(hbuf);
  }
}

// Page 6 stand-in. On the device this page decodes and plays random cat GIFs
// from /cats/ on the SD card frame-by-frame (AnimatedGIF, in the firmware's
// gifTick()) — which the canvas simulator can't emulate, so it shows the same
// "CATS" title as the firmware's no-cats placeholder plus a note. This is the
// one page that is deliberately NOT a pixel-faithful twin of the hardware.
// Cats also double as the offline screen (see render()); `offline` overlays
// the OFFLINE banner on top, mirroring the firmware's gifTick(offline).
function drawGifPage(offline) {
  gfx.fillScreen(COL_BG);
  gfx.setTextColor(COL_ACCENT);
  gfx.setTextSize(3);
  gfx.setCursor(124, 92);  // "CATS" = 4 chars * 18px = 72; (320-72)/2 = 124

  gfx.setTextColor(COL_TEXT2);

  gfx.setTextColor(COL_TEXT);

}

// ── SETTINGS (click the footer's gear icon to enter) ──────────────────────
// Near-line-for-line port of the firmware's drawSettingsList()/
// drawSettingsLeaf() -- a generic scrollable list of setting names drilling
// into a generic value-picker grid, driven by the SETTINGS[] table above
// instead of a hand-copied page per setting. There's no real backlight in a
// browser, so brightness's chosen preset is also applied as a CSS filter on
// the canvas (see applyBrightnessFilter) purely as a simulator
// visualization; it isn't part of the firmware parity.
function drawSettingsList() {
  gfx.fillScreen(COL_BG);

  gfx.setTextColor(COL_ACCENT);
  gfx.setTextSize(2);
  gfx.setCursor(10, 10);
  gfx.print('X');

  // Shares the header line with "X" now (was its own textSize(3) line above
  // the rows) -- freed-up height goes to the row viewport below instead.
  // "SETTINGS" is 8 chars * 6px/char at size 1 = 48px wide; right-aligned
  // flush against the screen's right edge.
  gfx.setTextColor(COL_ACCENT);
  gfx.setTextSize(1);
  gfx.setCursor(320 - 48, 14);
  gfx.print('SETTINGS');

  gfx.setClipRect(0, SETTINGS_VIEWPORT_Y0, 320, SETTINGS_VIEWPORT_H);
  for (let idx = 0; idx < SETTINGS_COUNT; idx++) {
    const y = SETTINGS_VIEWPORT_Y0 + idx * SET_ROW_STEP - STATE.settingsScrollOffset;
    if (y + SET_ROW_H < SETTINGS_VIEWPORT_Y0 || y > SETTINGS_VIEWPORT_Y0 + SETTINGS_VIEWPORT_H) continue;
    gfx.fillRoundRect(SET_ROW_X0, y, SET_ROW_W, SET_ROW_H, 6, COL_SURFACE);
    gfx.drawRoundRect(SET_ROW_X0, y, SET_ROW_W, SET_ROW_H, 6, COL_BORDER);
    gfx.setTextColor(COL_TEXT);
    gfx.setTextSize(2);
    gfx.setCursor(SET_ROW_X0 + 12, y + (SET_ROW_H - 16) / 2);
    gfx.print(SETTINGS[idx].label);
    gfx.setTextColor(COL_ACCENT);
    gfx.setCursor(SET_ROW_X0 + SET_ROW_W - 24, y + (SET_ROW_H - 16) / 2);
    gfx.print('>');
  }
  gfx.clearClipRect();

  if (SETTINGS_SCROLL_MAX > 0) {
    gfx.fillRoundRect(SETTINGS_SCROLLBAR_X, SETTINGS_VIEWPORT_Y0, SETTINGS_SCROLLBAR_W, SETTINGS_VIEWPORT_H, 2, COL_BORDER);
    let thumbH = SETTINGS_VIEWPORT_H * SETTINGS_VIEWPORT_H / SETTINGS_CONTENT_H;
    if (thumbH < 16) thumbH = 16;
    const thumbY = SETTINGS_VIEWPORT_Y0 +
        (SETTINGS_VIEWPORT_H - thumbH) * STATE.settingsScrollOffset / SETTINGS_SCROLL_MAX;
    gfx.fillRoundRect(SETTINGS_SCROLLBAR_X, thumbY, SETTINGS_SCROLLBAR_W, thumbH, 2, COL_ACCENT);
  }
}

function drawSettingsLeaf() {
  const def = SETTINGS[STATE.settingsLeafIndex];
  gfx.fillScreen(COL_BG);

  gfx.setTextColor(COL_ACCENT);
  gfx.setTextSize(2);
  gfx.setCursor(10, 10);
  gfx.print('< BACK');

  gfx.setTextColor(COL_ACCENT);
  gfx.setTextSize(3);
  gfx.setCursor(10, 40);
  gfx.print(def.leafTitle);

  if (def.subtitle) {
    gfx.setTextColor(COL_TEXT2);
    gfx.setTextSize(1);
    gfx.setCursor(10, 76);
    gfx.print(def.subtitle);
  }

  const current = def.destructive ? -1 : def.getCurrent();
  const armed = def.destructive && STATE.confirmArmedRow === STATE.settingsLeafIndex &&
                (performance.now() - STATE.confirmArmedMs < CONFIRM_ARM_MS);
  const btnW = def.count === 1 ? SET_WIDE_BTN_W : SET_BTN_W;
  for (let i = 0; i < def.count; i++) {
    const col = i % def.cols;
    const row = Math.floor(i / def.cols);
    const x = def.count === 1 ? SET_WIDE_BTN_X0 : SET_BTN_X0 + col * SET_BTN_STEP;
    const y = SET_BTN_Y + row * SET_BTN_STEP_Y;
    const on = armed || (!def.destructive && def.values[i] === current);
    const fill = armed ? COL_WARN : (on ? COL_ACCENT : COL_SURFACE);
    const border = armed ? COL_WARN : (on ? COL_ACCENT : COL_BORDER);
    gfx.fillRoundRect(x, y, btnW, SET_BTN_H, 6, fill);
    gfx.drawRoundRect(x, y, btnW, SET_BTN_H, 6, border);
    const label = armed ? 'TAP AGAIN' : def.valueLabels[i];
    const lw = label.length * 6 * def.btnTextSize;
    gfx.setTextColor(on ? COL_BG : COL_TEXT);
    gfx.setTextSize(def.btnTextSize);
    gfx.setCursor(x + (btnW - lw) / 2, y + (SET_BTN_H - 8 * def.btnTextSize) / 2);
    gfx.print(label);
  }

  gfx.setTextColor(COL_TEXT2);
  gfx.setTextSize(1);
  const hw = def.hint.length * 6;
  const hintY = def.rows > 1 ? 230 : 168;  // clears the 2-row grid (e.g. Boot Page)
  gfx.setCursor((320 - hw) / 2, hintY);
  gfx.print(def.hint);
}

function loadBatterySave() {

  // Accept 0/1/2; legacy 'true-ish' non-zero that isn't a number stays ON.
  if (!Number.isNaN(v)) {

  } else if (raw !== '0') {
    STATE.cfgBatterySaveMode = BATTERY_SAVE_ON;
  }
}

function render() {
  // Pixel shift: advance the orbit on the firmware's cadence, blank the panel
  // (the firmware's clearShiftMargins() edge strips), then draw the whole
  // frame translated by the current offset — the canvas twin of presentFrame's
  // frame.pushSprite(shiftX, shiftY).
  const nowMs = performance.now();
  if (SHIFT_STEP_MS > 0 && nowMs - STATE.lastShiftMs >= SHIFT_STEP_MS) {
    STATE.lastShiftMs = nowMs;
    STATE.shiftIdx = (STATE.shiftIdx + 1) % 8;
  }
  const shiftX = SHIFT_ORBIT[STATE.shiftIdx][0];
  const shiftY = SHIFT_ORBIT[STATE.shiftIdx][1];
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, 320, 240);
  ctx.save();
  ctx.translate(shiftX, shiftY);
  drawScreenContent();
  ctx.restore();
  if (shiftX !== 0 || shiftY !== 0) {
    document.getElementById('page-status').textContent +=
      ' · shift (' + shiftX + ',' + shiftY + ')';
  }

  const bkk = bangkokParts();
  if (bkk) {
    const min = parseInt(bkk.minute);
    const sec = parseInt(bkk.second);
    if (min === 0 && sec < 6) {
      if (sec % 2 === 0) {
        ctx.save();
        ctx.globalCompositeOperation = 'difference';
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 320, 240);
        ctx.restore();
        document.getElementById('page-status').textContent = 'HOURLY SIGNAL (INVERT FLASH)';
      }
    }
  }
}

function drawScreenContent() {
  // Settings takes priority over everything else, mirroring the firmware's
  // loop() where settingsScreen != SET_OFF short-circuits the catMode/
  // normal-render split.
  if (STATE.settingsScreen === 'leaf') {
    drawSettingsLeaf();
    document.getElementById('page-status').textContent = 'SETTINGS: ' + SETTINGS[STATE.settingsLeafIndex].label;
    return;
  }
  if (STATE.settingsScreen === 'list') {
    drawSettingsList();
    document.getElementById('page-status').textContent = 'SETTINGS (list)';
    return;
  }
  if (STATE.weatherPageOpen) {
    drawWeatherPage();
    drawBatterySaveIcon();
    document.getElementById('page-status').textContent = 'WEATHER (tap to close)';
    return;
  }
  if (STATE.devicePageOpen) {
    gfx.fillScreen(COL_BG);
    drawDevicePage();
    drawBatterySaveIcon();
    document.getElementById('page-status').textContent = 'DEVICE STATS (tap to close)';
    return;
  }
  // Offline mode also shows cats (with an OFFLINE banner on top) instead of a bare offline screen — mirrors
  // the firmware's catMode in loop().
  if (!STATE.haveData) {
    drawGifPage(true);
    drawBatterySaveIcon();
    document.getElementById('page-status').textContent = 'OFFLINE (cat GIFs)';
    return;
  }
  if (STATE.currentPage === GIF_PAGE) {
    drawGifPage(false);
    drawBatterySaveIcon();
    document.getElementById('page-status').textContent =
      'page ' + (GIF_PAGE + 1) + '/' + PAGE_COUNT + ' (cat GIFs)';
    return;
  }
  if (STATE.currentPage === MIXED_PAGE) {
    drawMixedPage(false);
    drawBatterySaveIcon();
    document.getElementById('page-status').textContent =
      'page ' + (MIXED_PAGE + 1) + '/' + PAGE_COUNT + ' (status + cats)';
    return;
  }
  gfx.fillScreen(COL_BG);
  switch (STATE.currentPage) {
    case 0: drawStatusPage(); break;
    case 1: drawProjectsPage(); break;  // projects (7d) + 7-day trend combined
    case 2: drawLimitsPage(); break;    // /usage-style limits panel
  }
  drawFooter();
  drawBatterySaveIcon();

  let label = 'page ' + (STATE.currentPage + 1) + '/' + PAGE_COUNT;
  document.getElementById('page-status').textContent = label;
}
