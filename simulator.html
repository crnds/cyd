<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CYD Dashboard Simulator</title>
<style>
:root {
  --bg: #08090d;
  --surface: #0f1117;
  --surface-alt: #161b27;
  --border: rgba(255,255,255,0.08);
  --text: #f1f5f9;
  --text2: #94a3b8;
  --muted: #64748b;
  --accent: #F4620E;
  --good: #22c55e;
  --warn: #f43f5e;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.2);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  min-height: 100vh;
  padding: 24px;
}
header { margin-bottom: 20px; }
header h1 { font-size: 20px; font-weight: 600; }
header p { color: var(--text2); font-size: 13px; margin-top: 4px; }

.layout {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 24px;
  align-items: start;
}
@media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }

/* ── simulated device ── */
.device {
  background: #3a3208;
  background: linear-gradient(145deg, #4a4110, #2e2806);
  border-radius: 16px;
  padding: 26px 22px;
  box-shadow: var(--shadow);
  display: inline-block;
}
.device-label {
  text-align: center;
  color: rgba(255,255,255,0.35);
  font-size: 10px;
  letter-spacing: 2px;
  margin-top: 12px;
  text-transform: uppercase;
}
#screen {
  display: block;
  background: #000;
  border: 3px solid #111;
  border-radius: 4px;
  cursor: pointer;
  image-rendering: pixelated;
  /* content-box (overriding the global border-box reset): the canvas's
     width/height attributes are the true 320x240 pixel grid the firmware
     draws to. Under border-box the 3px border would eat into that grid,
     squeezing/clipping content near the edges — breaking the simulator's
     job of predicting what fits on the real 320px-wide screen. */
  box-sizing: content-box;
}

/* ── control panel ── */
.panel {
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-width: 640px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.card h2 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text2);
  margin-bottom: 12px;
}
.control-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-bottom: 10px;
}
.control-row:last-child { margin-bottom: 0; }
label { font-size: 13px; color: var(--text2); }
input[type="text"], select {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 7px 10px;
  font-size: 13px;
  font-family: inherit;
}
input[type="text"] { flex: 1; min-width: 220px; }
input[type="text"]:focus, select:focus, button:focus {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
button {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--text);
  padding: 7px 16px;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.15s ease;
}
button:hover { background: rgba(255,255,255,0.1); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { opacity: 0.88; }
.toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text2);
  cursor: pointer;
}
.status-line {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.status-line .dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-right: 5px;
}
.dot.ok { background: var(--good); animation: pulse 2s infinite; }
.dot.bad { background: var(--warn); }
@keyframes pulse { 50% { opacity: 0.4; } }

pre {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
  font-size: 11.5px;
  line-height: 1.5;
  overflow-x: auto;
  max-height: 260px;
  overflow-y: auto;
  color: var(--text2);
}
#log { max-height: 150px; }
#log .err { color: var(--warn); }
#log .ok { color: var(--good); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<header>
  <h1>CYD Dashboard Simulator</h1>
  <p>Simulates the 2.8&Prime; 320&times;240 landscape ESP32-2432S028R screen. Click/tap the screen to cycle pages, exactly like the firmware.</p>
</header>

<main class="layout">
  <section class="device" aria-label="Simulated CYD device">
    <canvas id="screen" width="320" height="240" aria-label="Simulated 320 by 240 landscape display, click to change page"></canvas>
    <div class="device-label">ESP32-2432S028R &middot; simulated</div>
  </section>

  <section class="panel">
    <div class="card">
      <h2>Connection</h2>
      <div class="control-row">
        <input type="text" id="server-url" value="http://localhost:8787/api/usage" aria-label="Server URL">
        <button class="primary" id="poll-now">Poll now</button>
      </div>
      <div class="control-row">
        <label for="poll-interval">Poll every</label>
        <select id="poll-interval" aria-label="Poll interval">
          <option value="5000">5s</option>
          <option value="10000">10s</option>
          <option value="20000" selected>20s (firmware default)</option>
          <option value="60000">60s</option>
          <option value="300000">5m</option>
        </select>
        <label class="toggle"><input type="checkbox" id="sim-offline"> Simulate server offline</label>
        <label class="toggle"><input type="checkbox" id="mock-data"> Use mock data</label>
        <label class="toggle"><input type="checkbox" id="sim-sd-missing"> Simulate SD card missing</label>
        <label class="toggle"><input type="checkbox" id="force-hourly-flash"> Force hourly flash (test)</label>
      </div>
      <div class="status-line">
        <span id="conn-status"><span class="dot bad"></span>not connected</span>
        <span id="fetch-status">no fetch yet</span>
        <span id="page-status">page 1/6</span>
      </div>
    </div>

    <div class="card">
      <h2>Last response</h2>
      <pre id="raw-json">&mdash;</pre>
    </div>

    <div class="card">
      <h2>Log</h2>
      <pre id="log"></pre>
    </div>
  </section>
</main>

<script>
// ── CONSTANTS (mirroring cyd_dashboard.ino) ───────────────
const POLL_DEFAULT_MS = 20000;
const PAGE_COUNT = 9;
const GIF_PAGE = 6;   // 7th page: random cat GIFs on the device (stand-in here — see drawGifPage)
const MIXED_PAGE = 7; // 8th page: status + cats split

// Anti-retention pixel shift — mirrors the firmware's SHIFT_ORBIT/cfgShiftStepMs:
// the whole frame is blitted at an offset that orbits 0-2px (right/up only, so
// nothing is clipped away), one step every 3 minutes.
const SHIFT_ORBIT = [[0,0],[1,0],[2,0],[2,-1],[2,-2],[1,-2],[0,-2],[0,-1]];
// mirrors the firmware's cfgShiftStepMs -- not const since the Settings
// page's Pixel Shift leaf (applyPixelShift) can now change it at runtime.
let SHIFT_STEP_MS = 180000;  // firmware default; /config.json pixel_shift_min * 60000
// Consecutive failed polls before haveData is forced back to false, mirroring
// the firmware's fetchFailCycles/OFFLINE_AFTER_CYCLES.
const OFFLINE_AFTER_CYCLES = 3;
const LONG_TREND_DAYS = 30;
const DAILY_LOG_KEY = 'cyddashboard_v1_dailylog';
const LAST_USAGE_KEY = 'cyddashboard_v1_lastusage';

// Footer pagination dots: right-aligned so the rightmost dot's edge always
// lands at x=319, regardless of PAGE_COUNT (mirrors the firmware fix for a
// 5th dot pushing past the 320px screen edge).
const DOT_SPACING = 12;
const DOT_START_X = 300 - (PAGE_COUNT - 1) * DOT_SPACING;
const STALE_AFTER_SEC = 60;

// Invisible hit-box around the footer's connection-status dot (14,230) --
// clicking it opens the hidden Settings page, mirrors the firmware's
// PULSE_HIT_X0/X1/Y0/Y1.
const PULSE_HIT_X0 = 0, PULSE_HIT_X1 = 40, PULSE_HIT_Y0 = 214, PULSE_HIT_Y1 = 240;

// Weather card hit-box on the status page (page 0): fillRoundRect(150,170,60,46).
// Tap opens the Weather overlay — mirrors the firmware's WEATHER_HIT_*.
const WEATHER_HIT_X0 = 150, WEATHER_HIT_X1 = 210;
const WEATHER_HIT_Y0 = 170, WEATHER_HIT_Y1 = 216;
const WEATHER_HOURLY_N = 6;
const WEATHER_DAILY_N = 5;
const LAST_WEATHER_KEY = 'cyddashboard_v1_weather';

// Settings (generic LIST + leaf GRID) geometry -- mirrors the firmware's
// SET_BACK_*/SET_BTN_*/SET_ROW_* exactly.
const SET_BACK_X0 = 0, SET_BACK_X1 = 100, SET_BACK_Y0 = 0, SET_BACK_Y1 = 34;
const SET_BTN_X0 = 11, SET_BTN_Y = 100, SET_BTN_W = 54, SET_BTN_H = 56;
const SET_BTN_STEP = 58, SET_BTN_STEP_Y = 62;  // STEP_Y only matters for rows>1
const SET_ROW_X0 = 10, SET_ROW_Y0 = 34, SET_ROW_W = 284, SET_ROW_H = 46, SET_ROW_STEP = 52;
// A lone action button (count==1, e.g. Restart/Forget WiFi) gets the full
// row width instead of one narrow preset-grid cell -- mirrors the firmware's
// SET_WIDE_BTN_X0/W.
const SET_WIDE_BTN_X0 = SET_ROW_X0, SET_WIDE_BTN_W = SET_ROW_W;
// The list scrolls rather than paginates -- mirrors the firmware's
// SETTINGS_VISIBLE_ROWS/SETTINGS_VIEWPORT_*/SETTINGS_CONTENT_H/
// SETTINGS_SCROLL_MAX exactly (see settings.cpp).
const SETTINGS_VISIBLE_ROWS = 4;
const SETTINGS_VIEWPORT_Y0 = SET_ROW_Y0;
const SETTINGS_VIEWPORT_H = SETTINGS_VISIBLE_ROWS * SET_ROW_STEP - (SET_ROW_STEP - SET_ROW_H);
const SETTINGS_SCROLLBAR_X = 298, SETTINGS_SCROLLBAR_W = 4;
const BRIGHTNESS_KEY = 'cyddashboard_v1_brightness';
const BOOT_PAGE_KEY = 'cyddashboard_v1_bootpage';
const CAT_SHUFFLE_KEY = 'cyddashboard_v1_catshuffle';
const NIGHT_MODE_KEY = 'cyddashboard_v1_nightmode';
const ROTATION_KEY = 'cyddashboard_v1_rotation';
const SHOW_COUNTDOWN_KEY = 'cyddashboard_v1_showcountdown';
const BTC_CANDLE_IV_KEY = 'cyddashboard_v1_btccandleiv';
const BTC_RANGE_KEY = 'cyddashboard_v1_btcrange';
const BTC_CHART_STYLE_KEY = 'cyddashboard_v1_btcchartstyle';
const BTC_RANGE_BAR_KEY = 'cyddashboard_v1_btcrangebar';
const BTC_PRICE_HERO_KEY = 'cyddashboard_v1_btcpricehero';

// SettingDef table -- mirrors the firmware's SettingDef struct/SETTINGS[]
// array field-for-field (label/leafTitle/subtitle/hint/cols/rows/count/
// values/valueLabels/btnTextSize/destructive/getCurrent/apply), just as a
// plain JS array of objects instead of a C struct array.
function getCurrentBrightness() { return STATE.cfgBrightness; }
function applyBrightness(v) {
  STATE.cfgBrightness = v;
  localStorage.setItem(BRIGHTNESS_KEY, String(v));
  applyBrightnessFilter();
}
// Destructive/action rows have no "current value" -- drawSettingsLeaf()
// skips getCurrent() for them via .destructive, but the field still needs a
// function. A page reload is the simulator's stand-in for ESP.restart(): no
// real device to reboot, but it's the closest browser equivalent (STATE
// re-initializes fresh, same as the board re-running setup()).
function getCurrentNone() { return -1; }
function applyRestart(v) { location.reload(); }

// Forget WiFi: no real WiFi/AP-portal to simulate in a browser, so this is a
// console-log stand-in (same "no-op for firmware-only effects" pattern as
// Restart's reload) -- it doesn't erase brightness/boot-page, matching the
// firmware which only touches wifi_ssid/wifi_password.
function applyForgetWifi(v) {
  console.log('[sim] Forget WiFi: on real hardware this erases wifi_ssid/' +
              'wifi_password from config.json and restarts into the AP setup portal.');
  location.reload();
}

// Cat shuffle interval: cosmetic/persisted only -- the simulator's cat page
// is a static placeholder (see drawGifPage), not real GIF playback, so
// there's no pacing to actually hook this into (same firmware-only-effect
// exception already documented for cat GIFs generally).
function getCurrentCatShuffle() { return STATE.catShuffleSec; }
function applyCatShuffle(v) {
  STATE.catShuffleSec = v;
  localStorage.setItem(CAT_SHUFFLE_KEY, String(v));
}

// Night mode: fixed 23:00-07:00 schedule — dims to 25% AND swaps the UI
// palette to red monochrome (applyUiPalette). Mirrors the firmware's
// cfgNightModeOn/nightDimActive/NIGHT_MODE_DIM_VALUE/applyUiPalette.
// bangkokParts() is this simulator's getLocalTime() stand-in (no DST, fixed
// UTC+7, matching GMT_OFFSET_SEC), checked once/sec from tick() below.
let nightDimActive = false;
let lastNightCheckMs = 0;
function getCurrentNightMode() { return STATE.cfgNightModeOn ? 1 : 0; }
function applyNightMode(v) {
  STATE.cfgNightModeOn = v !== 0;
  localStorage.setItem(NIGHT_MODE_KEY, String(v));
  if (!STATE.cfgNightModeOn && nightDimActive) {
    applyUiPalette(false);        // restore day chrome
    applyBrightnessFilter();      // restore brightness filter
    nightDimActive = false;
    render();
  }
}
function checkNightMode() {
  const now = performance.now();
  if (now - lastNightCheckMs < 1000) return;
  lastNightCheckMs = now;
  if (!STATE.cfgNightModeOn) return;
  const bkk = bangkokParts();
  if (!bkk) return;
  const hour = parseInt(bkk.hour, 10);
  const inWindow = hour >= 23 || hour < 7;
  if (inWindow && !nightDimActive) {
    applyUiPalette(true);
    canvas.style.filter = 'brightness(25%)';
    nightDimActive = true;
    render();
  } else if (!inWindow && nightDimActive) {
    applyUiPalette(false);
    applyBrightnessFilter();
    nightDimActive = false;
    render();
  }
}

// Rotation flip: applies live on real hardware (see the firmware's
// applyRotation() comment for why touch needs no recalibration). A real
// 180deg canvas transform would need offsetX/offsetY math the click handler
// doesn't do, so this is a console-log stand-in + persisted value only,
// same "no-op for firmware-only effects" pattern as Restart/Forget WiFi.
function getCurrentRotation() { return STATE.cfgScreenRotation; }
function applyRotation(v) {
  STATE.cfgScreenRotation = v;
  localStorage.setItem(ROTATION_KEY, String(v));
  console.log('[sim] Rotation: on real hardware this calls gfx.applyRuntimeConfig() ' +
              'immediately, no restart -- see cyd_dashboard.ino for why touch needs no recalibration.');
}

// Show Countdown: green bars under 5h/week + analog clock timer wedge.
// Green reset hand always stays. Default ON (mirrors cfgShowCountdown).
function getCurrentShowCountdown() { return STATE.cfgShowCountdown ? 1 : 0; }
function applyShowCountdown(v) {
  STATE.cfgShowCountdown = v !== 0;
  localStorage.setItem(SHOW_COUNTDOWN_KEY, String(v));
}

// BTC ticker page (page 9) settings -- mirror settings.cpp's chart-style/
// candle-size/range/range-bar/price-hero rows exactly, including the
// range/candleIv<=288 auto-clamp (BTC_CANDLE_COUNT below == firmware's
// CANDLE_COUNT).
const BTC_CANDLE_COUNT = 288;
const BTC_CANDLE_IV_VALUES = [300, 900, 3600, 14400];
const BTC_RANGE_VALUES = [43200, 86400, 604800];

function getCurrentBtcChartStyle() { return STATE.cfgBtcChartStyle; }
function applyBtcChartStyle(v) {
  STATE.cfgBtcChartStyle = v;
  localStorage.setItem(BTC_CHART_STYLE_KEY, String(v));
}

function getCurrentBtcCandleIv() { return STATE.cfgBtcCandleIvSec; }
function applyBtcCandleIv(v) {
  STATE.cfgBtcCandleIvSec = v;
  if (STATE.cfgBtcRangeSec / v > BTC_CANDLE_COUNT) {
    for (let i = 2; i >= 0; i--) {
      if (BTC_RANGE_VALUES[i] / v <= BTC_CANDLE_COUNT) { STATE.cfgBtcRangeSec = BTC_RANGE_VALUES[i]; break; }
    }
  }
  localStorage.setItem(BTC_CANDLE_IV_KEY, String(v));
  localStorage.setItem(BTC_RANGE_KEY, String(STATE.cfgBtcRangeSec));
  regenerateMockCandlesIfMocked();
}

function getCurrentBtcRange() { return STATE.cfgBtcRangeSec; }
function applyBtcRange(v) {
  STATE.cfgBtcRangeSec = v;
  if (v / STATE.cfgBtcCandleIvSec > BTC_CANDLE_COUNT) {
    for (let i = 0; i < 4; i++) {
      if (v / BTC_CANDLE_IV_VALUES[i] <= BTC_CANDLE_COUNT) { STATE.cfgBtcCandleIvSec = BTC_CANDLE_IV_VALUES[i]; break; }
    }
  }
  localStorage.setItem(BTC_RANGE_KEY, String(v));
  localStorage.setItem(BTC_CANDLE_IV_KEY, String(STATE.cfgBtcCandleIvSec));
  regenerateMockCandlesIfMocked();
}

function getCurrentBtcRangeBar() { return STATE.cfgBtcRangeBar ? 1 : 0; }
function applyBtcRangeBar(v) {
  STATE.cfgBtcRangeBar = v !== 0;
  localStorage.setItem(BTC_RANGE_BAR_KEY, String(v));
}

function getCurrentBtcPriceHero() { return STATE.cfgBtcPriceHero ? 1 : 0; }
function applyBtcPriceHero(v) {
  STATE.cfgBtcPriceHero = v !== 0;
  localStorage.setItem(BTC_PRICE_HERO_KEY, String(v));
}

// Poll interval: wired to the sidebar's real "#poll-interval" select + its
// restartPollTimer(), so picking a preset here actually changes the
// simulated fetch cadence -- a genuine effect, not just a cosmetic stand-in.
function getCurrentPollInterval() {
  return Number(document.getElementById('poll-interval').value) / 1000;
}
function applyPollInterval(v) {
  document.getElementById('poll-interval').value = String(v * 1000);
  restartPollTimer();
}

// Pixel shift: SHIFT_STEP_MS is only read by render()'s shift-orbit advance
// (the browser has one thread, so no cross-core concern to mirror here).
function getCurrentPixelShift() { return SHIFT_STEP_MS / 60000; }
function applyPixelShift(v) { SHIFT_STEP_MS = v * 60000; }

// Boot page: all 8 pages (including cats/mixed) are valid -- drawScreenContent()
// already dispatches generically off STATE.currentPage regardless of how it
// was set, no special-casing needed here either.
function getCurrentBootPage() { return STATE.cfgBootPage; }
function applyBootPage(v) {
  STATE.cfgBootPage = v;
  STATE.currentPage = v;  // jump the live dashboard too, mirrors the firmware
  localStorage.setItem(BOOT_PAGE_KEY, String(v));
}

const SETTINGS = [
  { label: 'BRIGHTNESS', leafTitle: 'BRIGHTNESS', subtitle: 'BACKLIGHT BRIGHTNESS',
    hint: 'TAP A LEVEL TO APPLY', cols: 3, rows: 2, count: 6,
    values: [0, 13, 64, 128, 191, 255], valueLabels: ['0%', '5%', '25%', '50%', '75%', '100%'],
    btnTextSize: 2, destructive: false,
    getCurrent: getCurrentBrightness, apply: applyBrightness },
  { label: 'POLL INTERVAL', leafTitle: 'POLL INTERVAL', subtitle: 'HOW OFTEN TO FETCH /API/USAGE',
    hint: 'TAP A RATE TO APPLY', cols: 5, rows: 1, count: 5,
    values: [5, 10, 20, 60, 300], valueLabels: ['5s', '10s', '20s', '60s', '5m'],
    btnTextSize: 2, destructive: false,
    getCurrent: getCurrentPollInterval, apply: applyPollInterval },
  { label: 'PIXEL SHIFT', leafTitle: 'PIXEL SHIFT', subtitle: 'ANTI-RETENTION ORBIT INTERVAL',
    hint: 'TAP A RATE TO APPLY', cols: 4, rows: 1, count: 4,
    values: [0, 1, 3, 10], valueLabels: ['OFF', '1m', '3m', '10m'],
    btnTextSize: 2, destructive: false,
    getCurrent: getCurrentPixelShift, apply: applyPixelShift },
  { label: 'BOOT PAGE', leafTitle: 'BOOT PAGE', subtitle: 'PAGE SHOWN AFTER POWER-ON',
    hint: 'TAP A PAGE TO APPLY', cols: 3, rows: 3, count: 9,
    values: [0, 1, 2, 3, 4, 5, 6, 7, 8],
    valueLabels: ['STATUS', 'PROJECTS', 'HOME', 'DEVICE', 'TRENDS', 'LIMITS', 'CATS', 'MIXED', 'BTC'],
    btnTextSize: 1, destructive: false,
    getCurrent: getCurrentBootPage, apply: applyBootPage },
  { label: 'RESTART', leafTitle: 'RESTART', subtitle: '',
    hint: 'TAP TWICE TO RESTART THE BOARD', cols: 1, rows: 1, count: 1,
    values: [0], valueLabels: ['RESTART'],
    btnTextSize: 2, destructive: true,
    getCurrent: getCurrentNone, apply: applyRestart },
  { label: 'FORGET WIFI', leafTitle: 'FORGET WIFI', subtitle: '',
    hint: 'TAP TWICE TO ERASE WIFI CREDS', cols: 1, rows: 1, count: 1,
    values: [0], valueLabels: ['FORGET WIFI'],
    btnTextSize: 2, destructive: true,
    getCurrent: getCurrentNone, apply: applyForgetWifi },
  { label: 'CAT SHUFFLE', leafTitle: 'CAT SHUFFLE', subtitle: 'HOW LONG EACH CAT GIF PLAYS',
    hint: 'TAP A RATE TO APPLY', cols: 4, rows: 1, count: 4,
    values: [0, 5, 10, 30], valueLabels: ['OFF', '5s', '10s', '30s'],
    btnTextSize: 2, destructive: false,
    getCurrent: getCurrentCatShuffle, apply: applyCatShuffle },
  { label: 'NIGHT MODE', leafTitle: 'NIGHT MODE', subtitle: '23:00-07:00 DIM+RED UI',
    hint: 'TAP TO TOGGLE', cols: 2, rows: 1, count: 2,
    values: [0, 1], valueLabels: ['OFF', 'ON'],
    btnTextSize: 2, destructive: false,
    getCurrent: getCurrentNightMode, apply: applyNightMode },
  { label: 'ROTATION', leafTitle: 'ROTATION', subtitle: 'FOR UPSIDE-DOWN MOUNTING',
    hint: 'APPLIES IMMEDIATELY', cols: 2, rows: 1, count: 2,
    values: [1, 3], valueLabels: ['NORMAL', 'FLIPPED'],
    btnTextSize: 1, destructive: false,
    getCurrent: getCurrentRotation, apply: applyRotation },
  { label: 'SHOW COUNTDOWN', leafTitle: 'SHOW COUNTDOWN', subtitle: 'GREEN BARS + CLOCK WEDGE',
    hint: 'TAP TO TOGGLE', cols: 2, rows: 1, count: 2,
    values: [0, 1], valueLabels: ['OFF', 'ON'],
    btnTextSize: 2, destructive: false,
    getCurrent: getCurrentShowCountdown, apply: applyShowCountdown },
  { label: 'BTC CHART STYLE', leafTitle: 'BTC CHART STYLE', subtitle: 'PAGE 9 CANDLESTICK APPEARANCE',
    hint: 'TAP A STYLE TO APPLY', cols: 3, rows: 1, count: 3,
    values: [0, 1, 2], valueLabels: ['CANDLES', 'LINE', 'B/W'],
    btnTextSize: 2, destructive: false,
    getCurrent: getCurrentBtcChartStyle, apply: applyBtcChartStyle },
  { label: 'BTC CANDLE SIZE', leafTitle: 'BTC CANDLE SIZE', subtitle: 'TIME PER CANDLE ON PAGE 9',
    hint: 'TAP A SIZE TO APPLY', cols: 4, rows: 1, count: 4,
    values: BTC_CANDLE_IV_VALUES, valueLabels: ['5m', '15m', '1h', '4h'],
    btnTextSize: 2, destructive: false,
    getCurrent: getCurrentBtcCandleIv, apply: applyBtcCandleIv },

// ── SIMULATED GFX (LovyanGFX-ish API on canvas) ───────────
// Classic GFX font metrics: size 1 = 6x8 px per char (5x7 glyph + 1px gap).
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 3);
canvas.width = 320 * DPR;
canvas.height = 240 * DPR;
canvas.style.width = '320px';
canvas.style.height = '240px';
ctx.scale(DPR, DPR);

const gfx = {
  _color: COL_TEXT,
  _size: 1,
  _x: 0, _y: 0,
  fillScreen(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, 320, 240); },
  setTextColor(c) { this._color = c; },
  setTextSize(s) { this._size = s; },
  setCursor(x, y) { this._x = x; this._y = y; },
  print(str) {
    // The hardware GFX font is a 5x7 bitmap glyph in a 6x8 cell: it advances
    // 6px per char but the glyph fills 5px. Keep the 6px advance (so line
    // lengths match the device) while stretching each glyph to ~5px wide so
    // it fills the cell like the real font instead of leaving an airy gap.
    const s = this._size;
    const advance = 6 * s;
    const glyphW = 5 * s;
    ctx.fillStyle = this._color;
    ctx.font = `bold ${8 * s}px Menlo, Consolas, monospace`;
    ctx.textBaseline = 'top';
    str = String(str);
    for (let i = 0; i < str.length; i++) {
      const w = ctx.measureText(str[i]).width || glyphW;
      ctx.save();
      ctx.translate(this._x, this._y);
      ctx.scale(glyphW / w, 1);
      ctx.fillText(str[i], 0, 0);
      ctx.restore();
      this._x += advance;
    }
  },
  fillRect(x, y, w, h, c) {
    ctx.fillStyle = c;
    ctx.fillRect(x, y, w, h);
  },
  drawRect(x, y, w, h, c) {
    ctx.strokeStyle = c;
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  },
  drawFastVLine(x, y, h, c) {
    this.drawLine(x, y, x, y + h - 1, c);
  },
  textWidth(str) {
    return str.length * 6 * this._size;
  },
  fillRoundRect(x, y, w, h, r, c) {
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
  },
  drawRoundRect(x, y, w, h, r, c) {
    ctx.strokeStyle = c;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(x + 0.5, y + 0.5, w - 1, h - 1, r);
    ctx.stroke();
  },
  fillCircle(x, y, r, c) {
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  },
  drawCircle(x, y, r, c) {
    ctx.strokeStyle = c;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x + 0.5, y + 0.5, r, 0, Math.PI * 2);
    ctx.stroke();
  },
  fillTriangle(x0, y0, x1, y1, x2, y2, c) {
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.closePath();
    ctx.fill();
  },
  drawLine(x0, y0, x1, y1, c) {
    ctx.strokeStyle = c;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x0 + 0.5, y0 + 0.5);
    ctx.lineTo(x1 + 0.5, y1 + 0.5);
    ctx.stroke();
  },
  // Mirrors LovyanGFX/Adafruit drawFastHLine — used by the Weather page separators.
  drawFastHLine(x, y, w, c) {
    this.drawLine(x, y, x + w - 1, y, c);
  },
  // Mirrors LovyanGFX's drawWideLine(x0,y0,x1,y1,r,color) — r is the
  // wedge-line's half-width (radius), same unit as its firmware counterpart.
  drawWideLine(x0, y0, x1, y1, r, c) {
    ctx.strokeStyle = c;
    ctx.lineWidth = r * 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x0 + 0.5, y0 + 0.5);
    ctx.lineTo(x1 + 0.5, y1 + 0.5);
    ctx.stroke();
    ctx.lineCap = 'butt';
  },
  // Mirrors LovyanGFX's setClipRect/clearClipRect — used by the Settings
  // list's drag-scroll to keep partially-scrolled rows from drawing over the
  // header. save()/restore() bracket the canvas clip so it doesn't leak into
  // unrelated draw calls; clearClipRect() must be called before the next
  // fillScreen() or the clip region would stick around.
  setClipRect(x, y, w, h) {
    if (this._clipped) ctx.restore();
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();
    this._clipped = true;
  },
  clearClipRect() {
    if (this._clipped) { ctx.restore(); this._clipped = false; }
  },
};

// ── FORMATTING (mirroring the firmware) ───────────────────
function fmtTokens(t) {
  if (t >= 1e9) return (t / 1e9).toFixed(2) + 'B';
  if (t >= 1e6) return (t / 1e6).toFixed(1) + 'M';
  if (t >= 1e3) return (t / 1e3).toFixed(1) + 'K';
  return String(t);
}
function fmtCost(c) { return '$' + c.toFixed(2); }
function fmtBtc(p) {
  if (p < 0) return '--';
  return Math.round(p).toLocaleString('en-US');
}
function fmtCountdown(sec) {
  if (sec < 0) return '';
  let m = Math.floor((sec + 30) / 60);  // round to nearest minute
  const h = Math.floor(m / 60);
  m %= 60;
  return h > 0 ? h + 'h:' + String(m).padStart(2, '0') + 'm' : m + 'm';
}
// Day-aware countdown for windows that can span multiple days (the weekly
// reset). >=1 day: "1d:12h" (days + hours only). <1 day: "23h:59m", same
// shape as fmtCountdown.
function fmtCountdownDHM(sec) {
  if (sec < 0) return '';
  let totalMin = Math.floor((sec + 30) / 60);  // round to nearest minute
  const days = Math.floor(totalMin / 1440);
  if (days > 0) {
    const hours = Math.floor((totalMin % 1440) / 60);
    return days + 'd:' + hours + 'h';
  }
  const hours = Math.floor(totalMin / 60);
  const mins = totalMin % 60;
  return hours + 'h:' + String(mins).padStart(2, '0') + 'm';
}
function fmtKB(bytes) { return (bytes / 1024).toFixed(1) + 'KB'; }
function fmtGB(bytes) { return (bytes / (1024 ** 3)).toFixed(1) + 'GB'; }

// ── PAGE DRAWING (line-for-line port of the .ino) ─────────
function drawFooter() {
  // Status dot: blinks once a second while the most recent poll reached the
  // server — green on the odd second, off on the even second, so the pulse is
  // easy to read at a glance. Static amber when coasting on cached data
  // (haveData true but connected false — render() only reaches here when
  // haveData is true).
  const onPhase = Math.floor(performance.now() / 1000) % 2;
  if (!STATE.connected) gfx.fillCircle(14, 230, 3, COL_ACCENT);
  else if (onPhase) gfx.fillCircle(14, 230, 4, COL_GOOD);

  for (let i = 0; i < PAGE_COUNT; i++) {
    const c = (i === STATE.currentPage) ? COL_ACCENT : COL_BORDER;
    gfx.fillCircle(DOT_START_X + i * DOT_SPACING, 230, 3, c);
  }

  const romPct = Math.round(FLASH_USED_BYTES / FLASH_TOTAL_BYTES * 100);
  const ramPct = Math.round(STATIC_RAM_BYTES / TOTAL_RAM_BYTES * 100);
  const cpuPct = Math.round(STATE.cpuPercentAvg);
  
  gfx.setTextSize(1);
  gfx.setCursor(30, 226);
  
  gfx.setTextColor(COL_TEXT2);
  gfx.print('CPU ');
  gfx.setTextColor(COL_TEXT);
  gfx.print(cpuPct + '%');
  gfx.setTextColor(COL_TEXT2);
  gfx.print('  ROM ');
  gfx.setTextColor(COL_TEXT);
  gfx.print(romPct + '%');
  gfx.setTextColor(COL_TEXT2);
  gfx.print('  RAM ');
  gfx.setTextColor(COL_TEXT);
  gfx.print(ramPct + '%');

  // Minimal 1px line along the bottom edge, filling left-to-right as the
  // next poll approaches (full width = fetch imminent).
  const pollMs = Number(document.getElementById('poll-interval').value) || POLL_DEFAULT_MS;
  let elapsed = performance.now() - STATE.lastPollMs;
  if (elapsed > pollMs) elapsed = pollMs;
  const lineW = Math.round(elapsed / pollMs * 304);
  if (lineW > 0) gfx.fillRect(0, 239, lineW, 1, COL_TEXT2);
}

function drawLimitBlock(y, title, percent, resets, resetsInSec) {
  gfx.setTextColor(COL_TEXT);
  gfx.setTextSize(1);
  gfx.setCursor(10, y);
  gfx.print(title);

  const barX = 10, barY = y + 22, barW = 175, barH = 16;
  gfx.fillRoundRect(barX, barY, barW, barH, 3, COL_TRACK);
  if (percent >= 0) {
    const fillW = Math.round(Math.min(percent, 100) / 100 * barW);
    gfx.fillRoundRect(barX, barY, Math.max(fillW, 3), barH, 3, COL_ACCENT);
  }

  gfx.setTextColor(COL_TEXT);
  gfx.setTextSize(2);
  gfx.setCursor(195, barY + 1);
  gfx.print(percent >= 0 ? percent + '% used' : '--');

  gfx.setTextColor(COL_TEXT2);
  gfx.setTextSize(2);
  gfx.setCursor(10, barY + 26);
  let line = resets ? 'Resets ' + resets : 'Resets --';
  if (resets && resetsInSec >= 0) {
    line += ' (' + fmtCountdown(resetsInSec) + ')';
  }
  gfx.print(line);
}

// One row of the /usage-style limits page: label left, right-aligned value,

  gfx.setTextSize(1);

  gfx.setCursor(10, y);
  gfx.print(label);
  gfx.setTextColor(COL_TEXT2);
  gfx.setCursor(294 - right.length * 6, y);
  gfx.print(right);
  gfx.fillRoundRect(10, y + 12, 284, 8, 2, COL_TRACK);

    const fillW = Math.round(Math.min(percent, 100) / 100 * 284);
    gfx.fillRoundRect(10, y + 12, Math.max(fillW, 3), 8, 2, COL_ACCENT);
  }
}

// Page 6: the Claude Code /usage panel — context window, 5-hour limit,

// usage credits. Rows shift up when a row is absent.
function drawLimitsPage() {
  gfx.setTextColor(COL_TEXT);

  gfx.print('USAGE LIMITS');

    ? fmtTokens(STATE.ctxTokens) + '  ' + STATE.ctxPercent + '%' : '--';

  drawLimitsRow(y, '5-hour limit',
    limitRowText(STATE.sessionPercent, STATE.sessionResets), STATE.sessionPercent); y += 40;

    limitRowText(STATE.weekPercent, STATE.weekResets), STATE.weekPercent); y += 40;

    drawLimitsRow(y, 'Weekly (' + (STATE.weekModelName || 'model') + ')',
      limitRowText(STATE.weekModelPercent, STATE.weekModelResets), STATE.weekModelPercent); y += 40;

    drawLimitsRow(y, 'Usage credits',
      fmtCost(STATE.creditsUsed) + ' of ' + fmtCost(STATE.creditsLimit),
      STATE.creditsPercent);

}

function drawHomePage() {
  // Tick the session countdown down locally between polls.
  let sessionRem = STATE.sessionResetsInSec;
  if (sessionRem >= 0) {
    sessionRem -= Math.floor((performance.now() - STATE.lastFetchOkMs) / 1000);
    if (sessionRem < 0) sessionRem = 0;
  }
  // Week has no countdown suffix here: its "Resets <date>" string is already
  // close to the line's pixel budget (see drawLimitsCard's size1 note below),
  // so appending " (HHh:MMm)" would overflow the 320px screen.
  drawLimitBlock(10, 'Current session', STATE.sessionPercent, STATE.sessionResets, sessionRem);

// Simple vector weather icon (line-for-line port of the firmware's
// drawWeatherIcon), mapped from Open-Meteo's WMO weather_code.
// Scaled down (~0.65x) from the original so the weather card can shrink to
// match the BTC card's minimum content height (see drawStatusPage).
function drawWeatherIcon(x, y, code) {
  if (code < 0) {
    gfx.setTextColor(COL_TEXT2);
    gfx.setTextSize(1);
    gfx.setCursor(x, y + 4);
    gfx.print('--');
    return;
  }
  const cx = x + 8, cy = y + 7;
  if (code === 0 || code === 1) {
    // clear: sun disc + 8 short rounded rays (cardinals then diagonals),
    // with a 2-3px gap between disc and rays so they read as separate.
    gfx.fillCircle(cx, cy, 4, COL_YELLOW);
    gfx.drawWideLine(cx, cy - 9, cx, cy - 7, 1, COL_YELLOW);
    gfx.drawWideLine(cx, cy + 7, cx, cy + 9, 1, COL_YELLOW);
    gfx.drawWideLine(cx - 9, cy, cx - 7, cy, 1, COL_YELLOW);
    gfx.drawWideLine(cx + 7, cy, cx + 9, cy, 1, COL_YELLOW);
    gfx.drawWideLine(cx - 7, cy - 7, cx - 5, cy - 5, 1, COL_YELLOW);
    gfx.drawWideLine(cx + 5, cy + 5, cx + 7, cy + 7, 1, COL_YELLOW);
    gfx.drawWideLine(cx - 7, cy + 7, cx - 5, cy + 5, 1, COL_YELLOW);
    gfx.drawWideLine(cx + 5, cy - 5, cx + 7, cy - 7, 1, COL_YELLOW);
    return;
  }
  // Rain/snow/lightning are drawn standalone (no cloud underneath) so the
  // condition itself reads clearly at this icon's small size — a cloud
  // sharing the space with a tiny overlay was too cluttered to tell apart.
  if (code >= 95) {
    // thunderstorm: zigzag bolt — a Material-style hexagon polygon
    // (bottom tip, notch, top prong) split into 4 fillTriangle calls
    // since the GFX API has no filled-polygon primitive. Vertices:
    // A(-1,+8) B(-1,+2) C(-5,+2) D(+1,-8) E(+1,-2) F(+5,-2).
    gfx.fillTriangle(cx - 5, cy + 2, cx + 1, cy - 8, cx + 1, cy - 2, COL_YELLOW);
    gfx.fillTriangle(cx - 5, cy + 2, cx + 1, cy - 2, cx - 1, cy + 2, COL_YELLOW);
    gfx.fillTriangle(cx - 1, cy + 2, cx + 1, cy - 2, cx + 5, cy - 2, COL_YELLOW);
    gfx.fillTriangle(cx - 1, cy + 2, cx + 5, cy - 2, cx - 1, cy + 8, COL_YELLOW);
    return;
  }
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) {
    // snow: six-armed snowflake = three rounded lines crossing at 60deg
    gfx.drawWideLine(cx, cy - 7, cx, cy + 7, 1, COL_TEXT);
    gfx.drawWideLine(cx - 6, cy - 4, cx + 6, cy + 4, 1, COL_TEXT);
    gfx.drawWideLine(cx - 6, cy + 4, cx + 6, cy - 4, 1, COL_TEXT);
    return;
  }
  if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) {
    // rain: three staggered teardrops (triangle cap fused onto a circle),
    // two small on top, one large below — classic rain glyph.
    gfx.fillTriangle(cx - 6, cy - 8, cx - 8, cy - 3, cx - 4, cy - 3, COL_BLUE);
    gfx.fillCircle(cx - 6, cy - 3, 2, COL_BLUE);
    gfx.fillTriangle(cx + 5, cy - 6, cx + 3, cy - 1, cx + 7, cy - 1, COL_BLUE);
    gfx.fillCircle(cx + 5, cy - 1, 2, COL_BLUE);
    gfx.fillTriangle(cx - 1, cy + 1, cx - 4, cy + 6, cx + 2, cy + 6, COL_BLUE);
    gfx.fillCircle(cx - 1, cy + 6, 3, COL_BLUE);
    return;
  }
  // Everything else shares a plain cloud (2/3/45/48 = cloudy/fog, or any
  // unmapped code): two overlapping puffs on a fully-rounded pill base.
  gfx.fillCircle(cx - 4, cy - 2, 4, COL_TEXT2);
  gfx.fillCircle(cx + 3, cy - 3, 5, COL_TEXT2);
  gfx.fillRoundRect(cx - 9, cy - 2, 19, 9, 4, COL_TEXT2);
}

// Thin inset progress bar: near-black track recessed into a surface card.
// Returns the fill width in px (-1 when percent is unknown) so callers can
// overlay effects on the filled region (the green bars' shine sweep below).
function drawMiniBar(x, y, w, percent, color, trackColor = COL_TRACK, h = 6) {
  gfx.fillRoundRect(x, y, w, h, h / 2, trackColor);
  if (percent < 0) return -1;
  const fillW = Math.max(Math.round(Math.min(percent, 100) / 100 * w), h);
  gfx.fillRoundRect(x, y, fillW, h, h / 2, color);
  return fillW;
}

// ── SHINE SWEEP ────────────────────────────────────────────
// Looping light band swept across the green reset-countdown bars' fill in
// drawLimitsCard (pages 1 and 8). The band crosses the full 122px track at
// constant speed but is only painted over the filled interior, so short
// fills just see it pass through. Twin of pages.cpp's drawShineStrip; the
// 20fps tick() makes it glide with no extra timer (the firmware instead
// tops it up between 1Hz renders via shineTick()).
const SHINE_PERIOD_MS = 2600;
const SHINE_BAND_R = 7;
const SHINE_BAR_W = 122, SHINE_BAR_H = 4;

// Interior columns only (2..fillW-3, full height) so the radius-2 rounded
// ends stay untouched; repainting non-band columns COL_GOOD erases the trail.
function drawShineStrip(x, y, fillW, nowMs) {
  if (fillW < 12) return;
  const phase = (nowMs % SHINE_PERIOD_MS) / SHINE_PERIOD_MS;
  const center = -SHINE_BAND_R + Math.floor(phase * (SHINE_BAR_W + 2 * SHINE_BAND_R));
  for (let i = 2; i <= fillW - 3; i++) {
    const d = Math.abs(i - center);
    const c = d <= 1 ? COL_SHINE_HI : d <= 4 ? COL_SHINE_MID : d <= SHINE_BAND_R ? COL_SHINE_LO : COL_GOOD;
    gfx.fillRect(x + i, y, 1, SHINE_BAR_H, c);
  }
}

const SESSION_WINDOW_SEC = 5 * 3600;        // 5h
const WEEK_WINDOW_SEC = 7 * 24 * 3600;      // 168h

// Reset-countdown fill: 0% right after a reset, 100% right before the next
// one. `remainingSec` is the live countdown (already ticked down locally
// between polls); `windowSec` is the fixed window length (5h or 168h).
function elapsedPercentOfWindow(remainingSec, windowSec) {
  if (remainingSec < 0) return -1;
  const elapsed = Math.max(0, windowSec - remainingSec);
  return Math.min(100, Math.max(0, Math.round(elapsed * 100 / windowSec)));
}

// Filled pie wedge from the hour hand's current angle clockwise to the
// reset angle, at 50% opacity green — a "time remaining" region layered
// under the ticks/hands so they stay legible on top. `startRad`/`endRad`
// are in the same screen-space radians as the hand angles below (canvas
// arc() already sweeps clockwise for increasing angle, matching the
// clock's own -90°-offset convention, so no extra sign flip is needed).
// True alpha here vs. pages.cpp's drawTimerWedge: LovyanGFX has no real
// alpha blending on this RGB565 display, so the firmware twin uses a
// precomputed solid blend color (COL_GOOD lerped 50% into COL_BG) instead.
// COL_GOOD_50 lives in the active palette (applyUiPalette).
function drawTimerWedge(cx, cy, r, startRad, endRad) {
  let delta = (endRad - startRad) % (2 * Math.PI);
  if (delta < 0) delta += 2 * Math.PI;
  ctx.save();
  ctx.fillStyle = COL_GOOD_50;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, r, startRad, startRad + delta, false);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// Minimal analog clock: a bare circle, 12/3/6/9 tick dots, and hour/minute
// hands — no numerals, no second hand. Angles are screen-space (y grows
// down) with a -90° offset so 0 minutes/hours points straight up (12
// o'clock); increasing angle then sweeps clockwise on screen, matching a
// real clock face.
function drawAnalogClock(cx, cy, r, hour24, minute, second, haveReset, resetHour24, resetMinute) {
  const hourAngle = ((hour24 % 12) + minute / 60) * 30 - 90;
  const minAngle = (minute + second / 60) * 6 - 90;
  const secAngle = second * 6 - 90;
  const hourRad = hourAngle * Math.PI / 180;
  const minRad = minAngle * Math.PI / 180;
  const secRad = secAngle * Math.PI / 180;

  // Timer region: hour hand -> next 5h reset, drawn first so the circle,
  // ticks, and hands all render crisply on top of the translucent fill.
  // Gated by Settings "Show Countdown"; the green reset hand below always draws.
  if (haveReset && STATE.cfgShowCountdown) {
    const resetAngle = ((resetHour24 % 12) + resetMinute / 60) * 30 - 90;
    const resetRad = resetAngle * Math.PI / 180;
    drawTimerWedge(cx, cy, r - 1, hourRad, resetRad);
  }

  gfx.drawCircle(cx, cy, r, COL_TEXT);
  // 12 short hour ticks radiating in from the rim, same -90° zero-at-top
  // convention as the hands below.
  for (let i = 0; i < 12; i++) {
    const tickRad = (i * 30 - 90) * Math.PI / 180;
    const x0 = cx + Math.cos(tickRad) * (r - 1);
    const y0 = cy + Math.sin(tickRad) * (r - 1);
    const x1 = cx + Math.cos(tickRad) * (r - 5);
    const y1 = cy + Math.sin(tickRad) * (r - 5);
    gfx.drawLine(x0, y0, x1, y1, COL_TEXT);
  }

  const hx = cx + Math.cos(hourRad) * r * 0.5;
  const hy = cy + Math.sin(hourRad) * r * 0.5;
  const mx = cx + Math.cos(minRad) * r * 0.8;
  const my = cy + Math.sin(minRad) * r * 0.8;
  const sx = cx + Math.cos(secRad) * r * 0.9;
  const sy = cy + Math.sin(secRad) * r * 0.9;

  // Hour/minute hands drawn wide (wedge lines) for a bolder look; the second
  // hand stays a thin single-pixel line to keep it visually distinct.
  gfx.drawWideLine(cx, cy, hx, hy, 2.0, COL_TEXT);
  gfx.drawWideLine(cx, cy, mx, my, 1.5, COL_TEXT);
  gfx.drawLine(cx, cy, sx, sy, COL_ACCENT);
  gfx.fillCircle(cx, cy, 2, COL_TEXT);

  // Session (5h) reset time: a thin green radius from center to rim, static
  // (unlike the hands) at whatever hour/minute the session next resets.
  // Floating on top of other hands.
  if (haveReset) {
    const resetAngle = ((resetHour24 % 12) + resetMinute / 60) * 30 - 90;
    const resetRad = resetAngle * Math.PI / 180;
    const rx = cx + Math.cos(resetRad) * (r - 2);
    const ry = cy + Math.sin(resetRad) * (r - 2);
    gfx.drawLine(cx, cy, rx, ry, COL_GOOD);
  }
}

function drawStatusPage() {
  drawLimitsCard();
  gfx.fillRoundRect(150, 4, 150, 162, 8, COL_SURFACE);
  gfx.drawRoundRect(150, 4, 150, 162, 8, COL_BORDER);
  gfx.fillRoundRect(150, 170, 60, 46, 8, COL_SURFACE);
  gfx.drawRoundRect(150, 170, 60, 46, 8, COL_BORDER);
  gfx.fillRoundRect(214, 170, 86, 46, 8, COL_SURFACE);
  gfx.drawRoundRect(214, 170, 86, 46, 8, COL_BORDER);

  // ── right cards: Bangkok analog + digital clock/date, weather, BTC price ──
  const bkk = bangkokParts();

  // Tick the session countdown down locally between polls, same as
  // drawLimitsCard, to find the wall-clock time it resets at.
  let sessionRem = STATE.sessionResetsInSec;
  if (sessionRem >= 0) {
    sessionRem -= Math.floor((performance.now() - STATE.lastFetchOkMs) / 1000);
    if (sessionRem < 0) sessionRem = 0;

    resetHour = Math.floor(totalSec / 3600);

  // Row 1: analog clock, centered on the card's full width. Radius grew

  const clockCx = 225, clockCy = 56, clockR = 44;
  if (bkk) {

                     haveReset, resetHour, resetMinute);

  // Row 2: digital time + date, back to their original size4/size2 (the

    gfx.setCursor(160 + 5 * 24, 128);
    gfx.print('.' + bkk.second);
  } else {
    gfx.setTextColor(COL_TEXT2);
    gfx.print('--.--');

  gfx.setTextColor(COL_TEXT2);

  // Weather card: icon and temp stacked (rather than side by side) since
  // the card is only 60px wide. The smaller icon (see drawWeatherIcon) is
  // what lets this card fit in the new 46px height with icon-top-then-temp
  // still snug against both edges.

  gfx.setTextColor(COL_TEXT);

    gfx.print(Math.round(STATE.weatherTempC));
    gfx.setTextSize(1);
    gfx.setTextColor(COL_TEXT2);
    gfx.print('C');
  } else {
    gfx.print('--');

  // BTC card: label+price pushed down to the card's bottom edge (mirroring
  // where the weather card's temp text sits) instead of leaving a gap below
  // a top-anchored block — this card's content is shorter than weather's.

  gfx.setTextColor(COL_TEXT);

// Weather detail overlay — twin of pages.cpp drawWeatherPage; lockstep.
// No place / HOURLY / 5-DAY word labels; freed height → larger daily dayStep.
function drawWeatherPage() {

  gfx.drawRoundRect(10, 4, 284, 52, 8, COL_BORDER);

  // Icon far left, vertically centered in the 52px card (~14–16px tall).
  const iconX = 16;

    gfx.setTextColor(COL_TEXT);

    gfx.setTextColor(COL_TEXT2);

  } else {

  {

    gfx.setTextSize(2);

    gfx.setTextColor(COL_TEXT2);
    gfx.setCursor(x, 36);
    gfx.print('H ');           // label + space (2 cells)
    x += 24;
    gfx.setTextColor(COL_TEXT);
    gfx.setCursor(x, 36);
    gfx.print(hStr);
    x += hStr.length * 12 + 18;  // value + inter-pair gap
    gfx.setTextColor(COL_TEXT2);
    gfx.setCursor(x, 36);
    gfx.print('L ');
    x += 24;
    gfx.setTextColor(COL_TEXT);
    gfx.setCursor(x, 36);
    gfx.print(lStr);
  }

  // ── Hourly (next 6) — no "HOURLY" label ──────────────────
  gfx.fillRoundRect(10, 60, 284, 56, 8, COL_SURFACE);
  gfx.drawRoundRect(10, 60, 284, 56, 8, COL_BORDER);

  const hourCount = STATE.weatherHourly.length > 0
    ? STATE.weatherHourly.length : WEATHER_HOURLY_N;
  const slotW = 47;
  for (let i = 0; i < hourCount && i < WEATHER_HOURLY_N; i++) {
    const sx = 11 + i * slotW;
    const cx = sx + Math.floor(slotW / 2);
    const slot = STATE.weatherHourly[i];
    const have = !!slot;
    const hour = have ? slot.h : -1;
    const temp = have ? slot.tempC : 0;
    const code = have ? slot.code : -1;

    if (i === 0) {
      gfx.fillRoundRect(sx + 6, 62, slotW - 12, 2, 1, COL_ACCENT);
    }

    gfx.setTextSize(1);
    gfx.setTextColor(i === 0 ? COL_ACCENT : COL_TEXT2);
    const hbuf = (have && hour >= 0)
      ? String(hour).padStart(2, '0') : '--';
    gfx.setCursor(cx - 6, 66);
    gfx.print(hbuf);

    drawWeatherIcon(cx - 8, 78, code);

    if (have) {
      const tbuf = String(temp);
      const tw = tbuf.length * 6;
      gfx.setTextColor(COL_TEXT);
      gfx.setCursor(cx - Math.floor(tw / 2), 102);
      gfx.print(tbuf);
    } else {
      gfx.setTextColor(COL_TEXT2);
      gfx.setCursor(cx - 6, 102);
      gfx.print('--');
    }
  }

  // ── 5-day — no "5-DAY" label; extra height → larger dayStep ─
  gfx.fillRoundRect(10, 122, 284, 114, 8, COL_SURFACE);
  gfx.drawRoundRect(10, 122, 284, 114, 8, COL_BORDER);

  let minT = 100, maxT = -100;
  for (const d of STATE.weatherDaily) {
    if (d.low < minT) minT = d.low;
    if (d.high > maxT) maxT = d.high;
  }
  if (maxT <= minT) { minT = 20; maxT = 40; }

  // dayStep 22: 5×22 = 110 inside 114px card (was 15 in 78px).
  const dayY0 = 126;
  const dayStep = 22;
  const barX = 96, barW = 150, barH = 6;
  const dayCount = STATE.weatherDaily.length > 0
    ? STATE.weatherDaily.length : WEATHER_DAILY_N;
  for (let i = 0; i < dayCount && i < WEATHER_DAILY_N; i++) {
    const y = dayY0 + i * dayStep;
    const day = STATE.weatherDaily[i];
    const have = !!day;
    const wd = have ? day.wd : -1;
    const lo = have ? day.low : 0;
    const hi = have ? day.high : 0;
    const code = have ? day.code : -1;

    const textY = y + 7;
    const barY = y + 8;
    const iconY = y + 4;

    gfx.setTextSize(1);
    gfx.setTextColor(i === 0 ? COL_ACCENT : COL_TEXT);
    gfx.setCursor(18, textY);
    gfx.print((have && wd >= 0 && wd < 7) ? WDAYS[wd] : '---');

    drawWeatherIcon(44, iconY, code);

    const lbuf = have ? String(lo) : '--';
    const hbuf = have ? String(hi) : '--';

    gfx.setTextColor(COL_TEXT2);
    gfx.setCursor(barX - 6 - lbuf.length * 6, textY);
    gfx.print(lbuf);

    gfx.fillRoundRect(barX, barY, barW, barH, Math.floor(barH / 2), COL_TRACK);
    if (have && maxT > minT) {
      const span = maxT - minT;
      let x0 = barX + Math.round((lo - minT) / span * barW);
      let x1 = barX + Math.round((hi - minT) / span * barW);
      if (x1 - x0 < barH) x1 = x0 + barH;
      gfx.fillRoundRect(x0, barY, x1 - x0, barH, Math.floor(barH / 2), COL_ACCENT);
    }

    gfx.setTextColor(COL_TEXT);
    gfx.setCursor(barX + barW + 6, textY);
    gfx.print(hbuf);
  }
}

function drawLongTrendPage() {
  gfx.setTextColor(COL_TEXT);
  gfx.setTextSize(2);
  gfx.setCursor(10, 6);
  gfx.print('30-Day Trend');

  const sdMissing = document.getElementById('sim-sd-missing').checked;
  if (sdMissing) {
    // Same tone as drawOfflineScreen: a bare centered grey message, since
    // this page has nothing to show without the card.
    gfx.setTextColor(COL_TEXT2);
    gfx.setTextSize(2);
    gfx.setCursor(52, 110);  // centered: "SD CARD NOT FOUND" is 17 chars * 12px = 204px
    gfx.print('SD CARD NOT FOUND');
    return;
  }

  // STATE.longTrend only gets an entry once a day rolls over, so on its own
  // it stops at yesterday — append one more bar so the rightmost bar matches
  // the "today" label. Uses last24hTokens (a rolling trailing 24h sum), not
  // trend[6] (midnight-to-now): trend[6] starts near zero at midnight and
  // only represents a full day right before rollover, which would make every
  // other, already-complete day's bar look inconsistent with it all day.
  const bars = STATE.longTrend.map(d => d.tokens);
  bars.push(STATE.last24hTokens);
  if (bars.length > LONG_TREND_DAYS) bars.shift();

  let maxTokens = 1;
  for (const t of bars) if (t > maxTokens) maxTokens = t;

  const chartX = 10, chartY = 36, chartH = 148, chartW = 290;
  const barW = 6, gap = 4;
  const startX = chartX + chartW - bars.length * (barW + gap);
  for (let i = 0; i < bars.length; i++) {
    const barH = Math.round(bars[i] / maxTokens * chartH);
    const bx = startX + i * (barW + gap);
    const by = chartY + chartH - barH;
    gfx.fillRoundRect(bx, by, barW, Math.max(barH, 2), 2, COL_ACCENT);
  }

  gfx.setTextColor(COL_TEXT2);
  gfx.setTextSize(1);
  gfx.setCursor(chartX, chartY + chartH + 6);
  gfx.print('oldest');
  gfx.setCursor(chartX + chartW - 30, chartY + chartH + 6);
  gfx.print('today');
  gfx.setCursor(chartX, chartY + chartH + 18);
  gfx.print(STATE.longTrend.length + ' days logged, peak ' + fmtTokens(maxTokens));
}

// Mirrors state.h's latestBtcPrice() -- page 9's candle store is the single
// source of truth for "the current BTC price", so the Status card and Home
// page glyph read the latest candle close instead of a separately-populated
// field. Falls back to STATE.btcPrice only before the first candle batch lands.
function latestBtcPrice() {
  return STATE.btcCandleCount > 0
    ? STATE.btcCandles[STATE.btcCandleCount - 1][4]
    : STATE.btcPrice;
}

// Chart's vertical slot shifts to reclaim whichever of price-hero/range-bar
// is hidden, so the candle box always ends at the same fixed bottom edge --
// mirrors pages.cpp's btcChartY0()/btcRangeBarY0()/BTC_CHART_BOTTOM.
const BTC_CHART_BOTTOM = 212;
function btcChartY0() {
  if (STATE.cfgBtcPriceHero) return STATE.cfgBtcRangeBar ? 96 : 84;
  return STATE.cfgBtcRangeBar ? 38 : 24;
}
function btcRangeBarY0() {
  return STATE.cfgBtcPriceHero ? 82 : 24;
}

function drawBtcChart() {
  const SCREEN_W      = 320;
  const CONTENT_RIGHT = SCREEN_W - 4;  // 4px min margin (matches the left-side clamp below) so glyphs/border don't clip flush against the edge
  const CANDLE_COUNT  = 288;
  const CHART_X0 = CONTENT_RIGHT - CANDLE_COUNT - 2;
  const CHART_Y0 = btcChartY0();
  const CHART_H  = BTC_CHART_BOTTOM - CHART_Y0;

  gfx.drawRect(CHART_X0 - 2, CHART_Y0 - 2, CANDLE_COUNT + 4, CHART_H + 4, COL_BORDER);

  const n = STATE.btcCandleCount;
  if (!n) return;

  let rangeMin = 1e18, rangeMax = -1e18;
  let haveRange = false;
  for (let i = 0; i < n; i++) {
    const r = STATE.btcCandles[i];
    if (!r || r[0] === 0) continue;
    const l = r[3];
    const h = r[2];
    if (l < rangeMin) rangeMin = l;
    if (h > rangeMax) rangeMax = h;
    haveRange = true;
  }
  if (!haveRange) return;
  let span = rangeMax - rangeMin;
  if (span < 1.0) span = 1.0;

  const priceToY = (p) => {
    const f = (p - rangeMin) / span;
    let y = CHART_Y0 + CHART_H - 1 - Math.floor(f * (CHART_H - 1));
    if (y < CHART_Y0) y = CHART_Y0;
    if (y > CHART_Y0 + CHART_H - 1) y = CHART_Y0 + CHART_H - 1;
    return y;
  };

  if (STATE.cfgBtcChartStyle === 1) {
    // LINE: a dim under-fill (one vertical line per candle, up to its close)
    // topped with a bright line connecting consecutive closes -- gaps
    // (r[0]===0) break the connecting line rather than jumping across them.
    let prevX = -1, prevY = 0;
    for (let i = 0; i < n; i++) {
      const r = STATE.btcCandles[i];
      const x = CHART_X0 + i;
      if (!r || r[0] === 0) { prevX = -1; continue; }
      const yC = priceToY(r[4]);
      gfx.drawFastVLine(x, yC, CHART_Y0 + CHART_H - yC, COL_TRACK);
      if (prevX >= 0) gfx.drawLine(prevX, prevY, x, yC, COL_ACCENT);
      prevX = x;
      prevY = yC;
    }
  } else {
    // CANDLES (0) and B/W (2) share the same wick+body geometry; only the
    // colors differ -- B/W drops the bull/bear distinction entirely.
    for (let i = 0; i < n; i++) {
      const r = STATE.btcCandles[i];
      if (!r || r[0] === 0) continue;
      const x = CHART_X0 + i;
      const o = r[1], h = r[2], l = r[3], c = r[4];
      const bull = c >= o;
      const wickCol = (STATE.cfgBtcChartStyle === 2) ? COL_TEXT2 : (bull ? COL_GOOD_DIM : COL_BAD_DIM);
      const bodyCol = (STATE.cfgBtcChartStyle === 2) ? COL_TEXT  : (bull ? COL_GOOD : COL_WARN);

      let yH = priceToY(h);
      let yL = priceToY(l);
      if (yL < yH) { const tmp = yH; yH = yL; yL = tmp; }
      gfx.drawFastVLine(x, yH, yL - yH + 1, wickCol);

      let yO = priceToY(o);
      let yC = priceToY(c);
      let yTop = Math.min(yO, yC);
      let bodyLen = Math.max(yO, yC) - yTop + 1;
      gfx.drawFastVLine(x, yTop, bodyLen, bodyCol);
    }
  }

  gfx.setTextColor(COL_TEXT2);
  gfx.setTextSize(1);
  gfx.setCursor(CHART_X0 + 2, CHART_Y0 + 1);
  gfx.print(fmtBtc(rangeMax));
  gfx.setCursor(CHART_X0 + 2, CHART_Y0 + CHART_H - 9);
  gfx.print(fmtBtc(rangeMin));
}

// 24h high/low bar: "L $lo [====o====] H $hi" -- mirrors pages.cpp's
// drawBtcRangeBar() exactly (one compact row, independent of the candle-
// size/range settings since it always reflects the 24hr window).
function drawBtcRangeBar() {
  if (!STATE.cfgBtcRangeBar) return;
  const SCREEN_W      = 320;
  const CONTENT_RIGHT = SCREEN_W - 4;
  const ROW_Y = btcRangeBarY0();
  const BAR_H = 6;
  const BAR_Y = ROW_Y + 1;

  gfx.setTextColor(COL_TEXT2);
  gfx.setTextSize(1);
  const loStr = 'L' + fmtBtc(STATE.btcLow24h);
  const hiStr = 'H' + fmtBtc(STATE.btcHigh24h);
  const loW = loStr.length * 6;
  const hiW = hiStr.length * 6;

  gfx.setCursor(4, ROW_Y);
  gfx.print(loStr);

  const barX0 = 4 + loW + 4;
  const barX1 = CONTENT_RIGHT - hiW - 4;
  const barW = barX1 - barX0;
  if (barW > 0) {
    gfx.fillRoundRect(barX0, BAR_Y, barW, BAR_H, 3, COL_TRACK);
    if (STATE.btcHigh24h > 0 && STATE.btcLow24h > 0 && STATE.btcHigh24h > STATE.btcLow24h && barW > 6) {
      let f = (latestBtcPrice() - STATE.btcLow24h) / (STATE.btcHigh24h - STATE.btcLow24h);
      if (f < 0) f = 0;
      if (f > 1) f = 1;
      const markerX = barX0 + Math.floor(f * (barW - 6));
      gfx.fillRoundRect(markerX, BAR_Y - 2, 6, BAR_H + 4, 2, COL_ACCENT);
    }
  }

  gfx.setCursor(CONTENT_RIGHT - hiW, ROW_Y);
  gfx.print(hiStr);
}

function drawBtcPriceRow() {
  if (!STATE.cfgBtcPriceHero) return;
  const SCREEN_W      = 320;
  const CONTENT_RIGHT = SCREEN_W - 4;  // 4px min margin (matches the left-side clamp below)

  gfx.setTextSize(4);
  const price = latestBtcPrice();
  if (price <= 0) {
    gfx.setTextColor(COL_TEXT2);
    gfx.setCursor(4, 34);
    gfx.print('$--');
  } else {
    const priceStr = '$' + fmtBtc(price);
    let x = CONTENT_RIGHT - gfx.textWidth(priceStr);
    if (x < 4) x = 4;
    gfx.setTextColor(COL_TEXT);
    gfx.setCursor(x, 34);
    gfx.print(priceStr);
  }

  gfx.setTextSize(2);
  if (Number.isNaN(STATE.btcChangePct)) {
    gfx.setTextColor(COL_TEXT2);
    gfx.setCursor(4, 62);
    gfx.print('--');
  } else {
    const s = (STATE.btcChangePct >= 0 ? '+' : '') + STATE.btcChangePct.toFixed(2) + '%';
    let x = CONTENT_RIGHT - gfx.textWidth(s);
    if (x < 4) x = 4;
    gfx.setTextColor(STATE.btcChangePct >= 0 ? COL_GOOD : COL_WARN);
    gfx.setCursor(x, 62);
    gfx.print(s);
  }
}

// ── SETTINGS (hidden: click the footer's pulse dot to enter) ─────────────
// Near-line-for-line port of the firmware's drawSettingsList()/
// drawSettingsLeaf() -- a generic scrollable list of setting names drilling
// into a generic value-picker grid, driven by the SETTINGS[] table above
// instead of a hand-copied page per setting. There's no real backlight in a
// browser, so brightness's chosen preset is also applied as a CSS filter on
// the canvas (see applyBrightnessFilter) purely as a simulator
// visualization; it isn't part of the firmware parity.
function drawSettingsList() {
  gfx.fillScreen(COL_BG);

  gfx.setTextColor(COL_ACCENT);
  gfx.setTextSize(2);
  gfx.setCursor(10, 10);
  gfx.print('X');

  // Shares the header line with "X" now (was its own textSize(3) line above
  // the rows) -- freed-up height goes to the row viewport below instead.
  // "SETTINGS" is 8 chars * 6px/char at size 1 = 48px wide; right-aligned
  // against the 304px usable width (16px black margin reserved past that).
  gfx.setTextColor(COL_ACCENT);
  gfx.setTextSize(1);
  gfx.setCursor(304 - 48, 14);
  gfx.print('SETTINGS');

  gfx.setClipRect(0, SETTINGS_VIEWPORT_Y0, 320, SETTINGS_VIEWPORT_H);
  for (let idx = 0; idx < SETTINGS_COUNT; idx++) {
    const y = SETTINGS_VIEWPORT_Y0 + idx * SET_ROW_STEP - STATE.settingsScrollOffset;
    if (y + SET_ROW_H < SETTINGS_VIEWPORT_Y0 || y > SETTINGS_VIEWPORT_Y0 + SETTINGS_VIEWPORT_H) continue;
    gfx.fillRoundRect(SET_ROW_X0, y, SET_ROW_W, SET_ROW_H, 6, COL_SURFACE);
    gfx.drawRoundRect(SET_ROW_X0, y, SET_ROW_W, SET_ROW_H, 6, COL_BORDER);
    gfx.setTextColor(COL_TEXT);
    gfx.setTextSize(2);
    gfx.setCursor(SET_ROW_X0 + 12, y + (SET_ROW_H - 16) / 2);
    gfx.print(SETTINGS[idx].label);
    gfx.setTextColor(COL_ACCENT);
    gfx.setCursor(SET_ROW_X0 + SET_ROW_W - 24, y + (SET_ROW_H - 16) / 2);
    gfx.print('>');
  }
  gfx.clearClipRect();

  if (SETTINGS_SCROLL_MAX > 0) {

function drawSettingsLeaf() {
  const def = SETTINGS[STATE.settingsLeafIndex];
  gfx.fillScreen(COL_BG);

  gfx.setTextColor(COL_ACCENT);
  gfx.setTextSize(2);
  gfx.setCursor(10, 10);
  gfx.print('< BACK');

  gfx.setTextColor(COL_ACCENT);
  gfx.setTextSize(3);
  gfx.setCursor(10, 40);
  gfx.print(def.leafTitle);

  if (def.subtitle) {
    gfx.setTextColor(COL_TEXT2);
    gfx.setTextSize(1);
    gfx.setCursor(10, 76);
    gfx.print(def.subtitle);
  }

  const current = def.destructive ? -1 : def.getCurrent();
  const armed = def.destructive && STATE.confirmArmedRow === STATE.settingsLeafIndex &&
                (performance.now() - STATE.confirmArmedMs < CONFIRM_ARM_MS);
  const btnW = def.count === 1 ? SET_WIDE_BTN_W : SET_BTN_W;
  for (let i = 0; i < def.count; i++) {
    const col = i % def.cols;
    const row = Math.floor(i / def.cols);
    const x = def.count === 1 ? SET_WIDE_BTN_X0 : SET_BTN_X0 + col * SET_BTN_STEP;
    const y = SET_BTN_Y + row * SET_BTN_STEP_Y;
    const on = armed || (!def.destructive && def.values[i] === current);
    const fill = armed ? COL_WARN : (on ? COL_ACCENT : COL_SURFACE);
    const border = armed ? COL_WARN : (on ? COL_ACCENT : COL_BORDER);
    gfx.fillRoundRect(x, y, btnW, SET_BTN_H, 6, fill);
    gfx.drawRoundRect(x, y, btnW, SET_BTN_H, 6, border);
    const label = armed ? 'TAP AGAIN' : def.valueLabels[i];
    const lw = label.length * 6 * def.btnTextSize;
    gfx.setTextColor(on ? COL_BG : COL_TEXT);
    gfx.setTextSize(def.btnTextSize);
    gfx.setCursor(x + (btnW - lw) / 2, y + (SET_BTN_H - 8 * def.btnTextSize) / 2);
    gfx.print(label);
  }

  gfx.setTextColor(COL_TEXT2);
  gfx.setTextSize(1);
  const hw = def.hint.length * 6;
  const hintY = def.rows > 1 ? 230 : 168;  // clears the 2-row grid (e.g. Boot Page)
  gfx.setCursor((320 - hw) / 2, hintY);
  gfx.print(def.hint);

  gfx.fillRect(304, 0, 16, 240, '#000000');
}

function render() {
  // Pixel shift: advance the orbit on the firmware's cadence, blank the panel
  // (the firmware's clearShiftMargins() edge strips), then draw the whole
  // frame translated by the current offset — the canvas twin of presentFrame's
  // frame.pushSprite(shiftX, shiftY).
  const nowMs = performance.now();
  if (SHIFT_STEP_MS > 0 && nowMs - STATE.lastShiftMs >= SHIFT_STEP_MS) {
    STATE.lastShiftMs = nowMs;
    STATE.shiftIdx = (STATE.shiftIdx + 1) % 8;
  }
  const shiftX = SHIFT_ORBIT[STATE.shiftIdx][0];
  const shiftY = SHIFT_ORBIT[STATE.shiftIdx][1];
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, 320, 240);
  ctx.save();
  ctx.translate(shiftX, shiftY);
  drawScreenContent();
  ctx.restore();
  if (shiftX !== 0 || shiftY !== 0) {
    document.getElementById('page-status').textContent +=
      ' · shift (' + shiftX + ',' + shiftY + ')';
  }

  const bkk = bangkokParts();
  if (bkk) {
    const min = parseInt(bkk.minute);
    const sec = parseInt(bkk.second);
    if (min === 0 && sec < 6) {
      if (sec % 2 === 0) {
        ctx.save();
        ctx.globalCompositeOperation = 'difference';
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 320, 240);
        ctx.restore();
        document.getElementById('page-status').textContent = 'HOURLY SIGNAL (INVERT FLASH)';
      }
    }
  }
}

function drawScreenContent() {
  // Settings takes priority over everything else, mirroring the firmware's
  // loop() where settingsScreen != SET_OFF short-circuits the catMode/
  // normal-render split.
  if (STATE.settingsScreen === 'leaf') {
    drawSettingsLeaf();
    document.getElementById('page-status').textContent = 'SETTINGS: ' + SETTINGS[STATE.settingsLeafIndex].label;
    return;
  }
  if (STATE.settingsScreen === 'list') {
    drawSettingsList();
    document.getElementById('page-status').textContent = 'SETTINGS (list)';
    return;
  }
  if (STATE.weatherPageOpen) {
    drawWeatherPage();
    // 5% right-edge padding (16px of 320px) always overlaid in black
    gfx.fillRect(304, 0, 16, 240, '#000000');
    document.getElementById('page-status').textContent = 'WEATHER (tap to close)';
    return;
  }
  // Offline mode also shows cats (with an OFFLINE banner on top) instead of a bare offline screen — mirrors
  // the firmware's catMode in loop().
  if (!STATE.haveData) {
    drawGifPage(true);
    document.getElementById('page-status').textContent = 'OFFLINE (cat GIFs)';
    return;
  }
  if (STATE.currentPage === GIF_PAGE) {
    drawGifPage(false);
    document.getElementById('page-status').textContent =
      'page 7/' + PAGE_COUNT + ' (cat GIFs)';
    return;
  }
  if (STATE.currentPage === MIXED_PAGE) {
    drawMixedPage(false);
    document.getElementById('page-status').textContent =
      'page 8/' + PAGE_COUNT + ' (status + cats)';
    return;
  }
  gfx.fillScreen(COL_BG);
  switch (STATE.currentPage) {
    case 0: drawStatusPage(); break;
    case 1: drawProjectsPage(); break;  // projects (7d) + 7-day trend combined
    case 2: drawHomePage(); break;
    case 3: drawDevicePage(); break;
    case 4: drawLongTrendPage(); break;
    case 5: drawLimitsPage(); break;    // /usage-style limits panel
    case 8: drawBtcTickerPage(); break;
  }
  drawFooter();
  
  // 5% right-edge padding (16px of 320px) always overlaid in black
  gfx.fillRect(304, 0, 16, 240, '#000000');
  
  let label = 'page ' + (STATE.currentPage + 1) + '/' + PAGE_COUNT;
  if (STATE.currentPage === 8) label += ' (BTC ticker)';
  document.getElementById('page-status').textContent = label;
}

// intervalSec/count let the Settings UI preview any candle-size/range combo
// while on mock data (see regenerateMockCandlesIfMocked below).
function generateMockCandles(intervalSec, count) {
  intervalSec = intervalSec || 300;
  count = count || 288;
  const candles = [];
  let basePrice = 109000;
  let t = Math.floor(Date.now() / 1000) - count * intervalSec;
  for (let i = 0; i < count; i++) {
    const change = (Math.random() - 0.48) * 400;
    const open = basePrice;
    const close = basePrice + change;
    const high = Math.max(open, close) + Math.random() * 150;
    const low = Math.min(open, close) - Math.random() * 150;
    candles.push([t, open, high, low, close]);
    basePrice = close;
    t += intervalSec;
  }
  return candles;
}

// Mirrors the firmware's SD-backed daily log, using localStorage as the
// simulator's stand-in for the on-device CSV (per the root CLAUDE.md's
// projectname_v1_keyname convention) — same day-rollover semantics, just a
// different persistence backend.
function loadLongTrend() {
  try {
    const raw = localStorage.getItem(DAILY_LOG_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    STATE.longTrend = parsed.slice(-LONG_TREND_DAYS);
    STATE.lastLoggedDate = STATE.longTrend.length ?
      STATE.longTrend[STATE.longTrend.length - 1].date : null;
  } catch {
    STATE.longTrend = [];
    STATE.lastLoggedDate = null;
  }
}

// Called after each successful fetch, mirroring appendDailyLogIfNeeded():
// logs the day that just ended (yesterday) using the token total it
// finished on, captured by the caller before applyData() overwrote
// STATE.trend with the new day's running total.
function appendDailyLogIfNeeded(todayDateStr, justEndedDayTokens) {
  const y = new Date(todayDateStr + 'T00:00:00');
  y.setDate(y.getDate() - 1);
  const yesterdayDateStr = y.toISOString().slice(0, 10);

  if (yesterdayDateStr === STATE.lastLoggedDate) return;  // same day, nothing to do
  if (STATE.lastLoggedDate === null && !STATE.longTrend.length) {
    // First poll ever (fresh log) — just record yesterday's date as the
    // baseline; the actual log starts tomorrow.
    STATE.lastLoggedDate = yesterdayDateStr;
    return;
  }

  STATE.longTrend.push({ date: yesterdayDateStr, tokens: justEndedDayTokens });
  if (STATE.longTrend.length > LONG_TREND_DAYS) STATE.longTrend.shift();
  STATE.lastLoggedDate = yesterdayDateStr;
  localStorage.setItem(DAILY_LOG_KEY, JSON.stringify(STATE.longTrend));
}

// Mirrors the firmware's SD-backed /last_usage.json cache, using
// localStorage as the simulator's stand-in — so the dashboard keeps
// showing real (if stale) data instead of going blank when a poll fails.
function saveLastUsageCache(doc) {
  try {
    localStorage.setItem(LAST_USAGE_KEY, JSON.stringify(doc));
  } catch { /* storage full/unavailable — cache is best-effort */ }
}

function loadCachedUsage() {
  try {
    const raw = localStorage.getItem(LAST_USAGE_KEY);
    if (!raw) return false;
    applyData(JSON.parse(raw));
    return true;
  } catch {
    return false;
  }
}

// Mirrors the firmware's applyWeatherDoc + /weather.json SD cache (localStorage
// is the simulator stand-in for the board's local weather DB).
function applyWeatherData(w) {
  if (!w) return;
  if (w.tempC != null) STATE.weatherTempC = w.tempC;
  if (w.code != null) STATE.weatherCode = w.code;
  if (w.high != null) STATE.weatherHigh = Math.round(w.high);
  if (w.low != null) STATE.weatherLow = Math.round(w.low);
  if (w.condition != null) STATE.weatherCondition = w.condition;
  if (w.place != null) STATE.weatherPlace = w.place;
  if (Array.isArray(w.hourly)) {
    STATE.weatherHourly = w.hourly.slice(0, WEATHER_HOURLY_N).map(h => ({
      h: h.h ?? -1, tempC: Math.round(h.tempC ?? 0), code: h.code ?? -1,
    }));
  }
  if (Array.isArray(w.daily)) {
    STATE.weatherDaily = w.daily.slice(0, WEATHER_DAILY_N).map(d => ({
      wd: d.wd ?? -1,
      high: Math.round(d.high ?? 0),
      low: Math.round(d.low ?? 0),
      code: d.code ?? -1,
    }));
  }
  saveWeatherCache();
}

function saveWeatherCache() {
  try {
    localStorage.setItem(LAST_WEATHER_KEY, JSON.stringify({
      tempC: STATE.weatherTempC,
      code: STATE.weatherCode,
      high: STATE.weatherHigh > -900 ? STATE.weatherHigh : null,
      low: STATE.weatherLow > -900 ? STATE.weatherLow : null,
      condition: STATE.weatherCondition,
      place: STATE.weatherPlace,
      hourly: STATE.weatherHourly,
      daily: STATE.weatherDaily,
    }));
  } catch { /* storage full/unavailable — cache is best-effort */ }
}

function loadWeatherCache() {
  try {
    const raw = localStorage.getItem(LAST_WEATHER_KEY);
    if (!raw) return;
    applyWeatherData(JSON.parse(raw));
  } catch { /* ignore corrupt cache */ }
}

// The browser has no on-device NTP equivalent to the firmware's
// configTime()/getLocalTime(), so the clock is derived straight from the
// system clock, converted to Asia/Bangkok (no DST, fixed UTC+7 — matches the
// firmware's GMT_OFFSET_SEC exactly).
function bangkokDateStr() {
  const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok' });  // en-CA -> YYYY-MM-DD
  return fmt.format(new Date());
}

function bangkokParts() {
  const fmt = new Intl.DateTimeFormat('en-US', {
    timeZone: 'Asia/Bangkok', hour12: false,
    weekday: 'short', month: 'short', day: 'numeric', year: 'numeric',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
  });
  const parts = {};
  for (const p of fmt.formatToParts(new Date())) parts[p.type] = p.value;
  
  const forceFlash = document.getElementById('force-hourly-flash')?.checked;
  if (forceFlash) {
    const sec = Math.floor(Date.now() / 1000) % 10;
    return {
      weekday: parts.weekday, month: parts.month, day: parts.day, year: parts.year,
      hour: parts.hour === '24' ? '00' : parts.hour,
      minute: '00',
      second: '0' + sec,
    };
  }

  return {
    weekday: parts.weekday, month: parts.month, day: parts.day, year: parts.year,
    hour: parts.hour === '24' ? '00' : parts.hour, minute: parts.minute, second: parts.second,
  };
}

// haveData is otherwise sticky-true once any fetch/cache load succeeds, so
// this is what makes a simulated outage actually flip the display back to
// the offline/cat screen after a few consecutive failed polls — mirrors the
// firmware's fetchFailCycles/OFFLINE_AFTER_CYCLES.
function markFetchFailed() {
  if (!STATE.haveData) STATE.haveData = loadCachedUsage();
  if (STATE.fetchFailCycles < OFFLINE_AFTER_CYCLES) STATE.fetchFailCycles++;
  if (STATE.fetchFailCycles >= OFFLINE_AFTER_CYCLES) STATE.haveData = false;
}

async function fetchUsage() {
  STATE.lastPollMs = performance.now();
  const offline = document.getElementById('sim-offline').checked;
  const mock = document.getElementById('mock-data').checked;

  if (mock) {
    applyData(MOCK);
    saveLastUsageCache(MOCK);
    STATE.haveData = true;
    STATE.fetchFailCycles = 0;
    STATE.wifiOk = true;
    STATE.connected = true;
    setConn(true, 'mock data');
    log('applied mock data', 'ok');
    render();
    return;
  }
  if (offline) {
    STATE.wifiOk = false;
    STATE.connected = false;
    markFetchFailed();
    setConn(false, 'simulated offline');
    log('poll skipped: simulated offline', 'err');
    render();
    return;
  }

  let url = document.getElementById('server-url').value.trim();
  // Requests the board's currently-selected BTC candle size/range, mirrors
  // the firmware's fetchUsage() query params -- see usage_server.py's do_GET.
  url += (url.includes('?') ? '&' : '?') +
    'civ=' + STATE.cfgBtcCandleIvSec + '&rng=' + STATE.cfgBtcRangeSec;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 5000);
  try {
    const res = await fetch(url, { signal: controller.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const doc = await res.json();
    applyData(doc);
    saveLastUsageCache(doc);
    STATE.haveData = true;
    STATE.fetchFailCycles = 0;
    STATE.wifiOk = true;
    STATE.connected = true;
    setConn(true, 'ok, ' + new Date().toLocaleTimeString());
    log('fetched ' + fmtTokens(doc.today?.tokens ?? 0) + ' today / ' +
        fmtTokens(doc.week?.tokens ?? 0) + ' week', 'ok');
  } catch (err) {
    STATE.wifiOk = false;
    STATE.connected = false;
    markFetchFailed();
    setConn(false, err.name === 'AbortError' ? 'timeout (5s)' : err.message);
    log('fetch failed: ' + err.message, 'err');
  } finally {
    clearTimeout(timer);
  }
  render();
}

function setConn(ok, detail) {
  document.getElementById('conn-status').innerHTML =
    `<span class="dot ${ok ? 'ok' : 'bad'}"></span>${ok ? 'connected' : 'disconnected'}`;
  document.getElementById('fetch-status').textContent = detail;
}

function log(msg, cls) {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = new Date().toLocaleTimeString() + '  ' + msg;
  el.prepend(line);
  while (el.childElementCount > 50) el.removeChild(el.lastChild);
}

function restartPollTimer() {
  clearInterval(STATE.pollTimer);
  const ms = Number(document.getElementById('poll-interval').value) || POLL_DEFAULT_MS;
  STATE.pollTimer = setInterval(fetchUsage, ms);
}

// ── SET_LIST drag-to-scroll ────────────────────────────────
// Mirrors the firmware's settingsListDragBegin/Move/End (settings.cpp): a
// mousedown/mousemove/mouseup gesture is a tap until it's moved more than
// SETTINGS_DRAG_TAP_PX total, at which point it's treated as a scroll instead
// (see the mousedown/mousemove/mouseup listeners below the click listener).
let settingsDragLastX = 0, settingsDragLastY = 0, settingsDragTotalMoveY = 0;
const SETTINGS_DRAG_TAP_PX = 8;

function settingsListDragBegin(tx, ty) {
  settingsDragLastX = tx;
  settingsDragLastY = ty;
  settingsDragTotalMoveY = 0;
}

function settingsListDragMove(tx, ty) {
  const dy = ty - settingsDragLastY;
  settingsDragLastX = tx;
  if (dy === 0) return;
  settingsDragLastY = ty;
  settingsDragTotalMoveY += Math.abs(dy);

  let newOffset = STATE.settingsScrollOffset - dy;  // drag up -> scroll list down (reveal later rows)
  if (newOffset < 0) newOffset = 0;
  if (newOffset > SETTINGS_SCROLL_MAX) newOffset = SETTINGS_SCROLL_MAX;
  if (newOffset !== STATE.settingsScrollOffset) {
    STATE.settingsScrollOffset = newOffset;
    render();
  }
}

function settingsListDragEnd() {
  if (settingsDragTotalMoveY >= SETTINGS_DRAG_TAP_PX) return;  // was a scroll, not a tap
  const tx = settingsDragLastX, ty = settingsDragLastY;

  if (tx >= SET_BACK_X0 && tx < SET_BACK_X1 && ty >= SET_BACK_Y0 && ty < SET_BACK_Y1) {
    STATE.settingsScreen = 'off';
    render();
    return;
  }
  for (let idx = 0; idx < SETTINGS_COUNT; idx++) {
    const y = SETTINGS_VIEWPORT_Y0 + idx * SET_ROW_STEP - STATE.settingsScrollOffset;
    if (y + SET_ROW_H < SETTINGS_VIEWPORT_Y0 || y > SETTINGS_VIEWPORT_Y0 + SETTINGS_VIEWPORT_H) continue;
    if (tx >= SET_ROW_X0 && tx < SET_ROW_X0 + SET_ROW_W && ty >= y && ty < y + SET_ROW_H) {
      STATE.settingsLeafIndex = idx;
      STATE.confirmArmedRow = -1;
      STATE.settingsScreen = 'leaf';
      render();
      break;
    }
  }
}

let settingsDragActive = false;  // a press is down and started while settingsScreen === 'list'
// The browser fires a synthetic 'click' after every mousedown+mouseup, which
// would otherwise re-process the same coordinates a second time (e.g.
// re-hit-testing them against whatever screen the drag just switched to,
// or falling through to page-nav) — this flag makes the click listener
// swallow exactly the one click that follows a SET_LIST press.
let suppressNextClick = false;
canvas.addEventListener('mousedown', (event) => {
  if (STATE.settingsScreen !== 'list') return;
  settingsDragActive = true;
  settingsListDragBegin(event.offsetX, event.offsetY);
});
canvas.addEventListener('mousemove', (event) => {
  if (!settingsDragActive) return;
  settingsListDragMove(event.offsetX, event.offsetY);
});
// On window, not canvas: a drag that releases outside the canvas bounds must
// still end the gesture, or settingsDragActive would stay stuck true.
window.addEventListener('mouseup', () => {
  if (!settingsDragActive) return;
  settingsDragActive = false;
  settingsListDragEnd();
  suppressNextClick = true;
});

// Touch feedback: flash a 5px white border on the left or right part of the screen
// for one frame, then re-render to clear it. Mirrors flashTouchBorder() in the firmware.
function flashTouchBorder(isRight) {
  const T = 5;
  if (isRight) {
    gfx.fillRect(152, 0, 152, T, COL_TEXT);        // top right
    gfx.fillRect(152, 240 - T, 152, T, COL_TEXT);  // bottom right
    gfx.fillRect(304 - T, 0, T, 240, COL_TEXT);    // right
  } else {
    gfx.fillRect(0, 0, 152, T, COL_TEXT);          // top left
    gfx.fillRect(0, 240 - T, 152, T, COL_TEXT);    // bottom left
    gfx.fillRect(0, 0, T, 240, COL_TEXT);          // left
  }
  setTimeout(render, 60);
}

canvas.addEventListener('click', (event) => {
  if (suppressNextClick) { suppressNextClick = false; return; }
  const tx = event.offsetX, ty = event.offsetY;
  const catMode = (STATE.currentPage === GIF_PAGE) || (STATE.currentPage === MIXED_PAGE) || !STATE.haveData;

  if (STATE.settingsScreen === 'leaf') {
    const def = SETTINGS[STATE.settingsLeafIndex];
    if (tx >= SET_BACK_X0 && tx < SET_BACK_X1 && ty >= SET_BACK_Y0 && ty < SET_BACK_Y1) {
      STATE.confirmArmedRow = -1;
      STATE.settingsScreen = 'list';
      render();
    } else {
      const btnW = def.count === 1 ? SET_WIDE_BTN_W : SET_BTN_W;
      for (let i = 0; i < def.count; i++) {
        const col = i % def.cols;
        const row = Math.floor(i / def.cols);
        const x = def.count === 1 ? SET_WIDE_BTN_X0 : SET_BTN_X0 + col * SET_BTN_STEP;
        const y = SET_BTN_Y + row * SET_BTN_STEP_Y;
        if (tx >= x && tx < x + btnW && ty >= y && ty < y + SET_BTN_H) {
          if (def.destructive) {
            const armed = STATE.confirmArmedRow === STATE.settingsLeafIndex &&
                          performance.now() - STATE.confirmArmedMs < CONFIRM_ARM_MS;
            if (armed) {
              STATE.confirmArmedRow = -1;
              def.apply(def.values[i]);  // may reload the page (Restart)
            } else {
              STATE.confirmArmedRow = STATE.settingsLeafIndex;
              STATE.confirmArmedMs = performance.now();
            }
          } else {
            def.apply(def.values[i]);
          }
          render();
          break;
        }
      }
    }
    return;
  }

  if (STATE.settingsScreen === 'list') {
    return;  // fully handled by the mousedown/mousemove/mouseup drag-scroll listeners below
  }

  if (STATE.weatherPageOpen) {
    // Any tap dismisses the Weather overlay — mirrors the firmware.
    STATE.weatherPageOpen = false;
    render();
    return;
  }

  if (!catMode && tx >= PULSE_HIT_X0 && tx < PULSE_HIT_X1 && ty >= PULSE_HIT_Y0 && ty < PULSE_HIT_Y1) {
    STATE.settingsScreen = 'list';
    STATE.settingsScrollOffset = 0;
    render();
    return;
  }

  if (!catMode && STATE.currentPage === 0 &&
      tx >= WEATHER_HIT_X0 && tx < WEATHER_HIT_X1 &&
      ty >= WEATHER_HIT_Y0 && ty < WEATHER_HIT_Y1) {
    // Tap the status-page weather card → open Weather overlay.
    STATE.weatherPageOpen = true;
    render();
    return;
  }

  const isRight = tx >= 152;
  if (isRight) {
    STATE.currentPage = (STATE.currentPage + 1) % PAGE_COUNT;
  } else {
    STATE.currentPage = (STATE.currentPage - 1 + PAGE_COUNT) % PAGE_COUNT;
  }
  render();
  flashTouchBorder(isRight);  // one-frame white edge flash on the new page: touch registered
});

document.getElementById('poll-now').addEventListener('click', fetchUsage);
document.getElementById('poll-interval').addEventListener('change', restartPollTimer);
document.getElementById('sim-offline').addEventListener('change', fetchUsage);
document.getElementById('mock-data').addEventListener('change', fetchUsage);
document.getElementById('sim-sd-missing').addEventListener('change', render);
document.getElementById('force-hourly-flash').addEventListener('change', render);

// Repaint at ~20fps so the bottom progress line advances smoothly, matching
// the firmware's incremental line top-ups between its 1s full repaints.
// Each tick also measures render()'s own time against the 50ms period and
// feeds an EMA — the same duty-cycle idea the firmware uses for cpuPercentAvg,
// just measuring canvas draw time instead of loop() work (there's no real
// device CPU to sample from a browser tab).
function tick() {
  const start = performance.now();
  render();
  checkNightMode();
  const busyMs = performance.now() - start;
  const sample = busyMs / 50 * 100;
  STATE.cpuPercentAvg = STATE.cpuPercentAvg * 0.9 + sample * 0.1;
}
setInterval(tick, 50);
